# This file records ownership and verification, never values of secrets,
# recovery codes, tokens, private keys, or non-public contact details.
people:
  product_owner: pending_bchc_assignment
  # Contracted interim maintainer until BCHC names its own (see MAINTAINERS.md).
  primary_technical_maintainer: crypticpy
  backup_release_maintainer: pending_bchc_assignment

settings:
  # Re-verified 2026-08-28 through the authenticated read-only REST API
  # (repos, rules/branches/main, actions/permissions, pages endpoints).
  repository_visibility: public
  default_branch: main
  branch_ruleset: protect-main
  branch_ruleset_scope: main
  pull_requests_required: true
  required_approvals: 0
  extra_approval_required_for_unattributed_changes: true
  required_checks:
    - "Lint, test and build"
    - "Build every preset and module combination"
    - "Coverage evidence"
    - "Analyze javascript-typescript"
    - "Analyze ruby"
    - "scale"
    - "lint"
    - "Content: entries and site build"
  required_checks_strict_up_to_date: false   # off since 2026-10-05: entries live in separate folders, and "Update branch" was the hardest step for a non-technical reviewer
  conversation_resolution_required: true
  force_push_blocked: true
  deletion_blocked: true
  tag_protection: false
  actions_allowed: selected
  default_workflow_permissions: read
  actions_may_approve_pull_requests: true
  sha_pinning_enforced_by_repository_setting: true # re-verified 2026-09-24
  pages_source_github_actions: true
  pages_https_enforced: true
  pages_environment_protection: branch_policy_only
  custom_domain: null
  custom_domain_owner: not_applicable_until_configured
  dns_renewal_owner: not_applicable_until_configured
  discussions: false
  private_vulnerability_reporting: true
  secret_scanning: true
  push_protection: true
  open_secret_scanning_alerts: 0
  dependabot_alerts: true
  dependabot_security_updates: true
  codeql: active_last_analysis_2026-08-28

automation:
  expected_variables:
    - CATALOG_METRICS
    - CATALOG_SHOWCASE
    - SECURITY_SIGNALS
    - SUBMISSIONS_OPEN
    - VERIFICATION_SWEEP
  repository_variables_present: []
  # Verified 2026-08-28: leaving all of these unset is the intended configuration
  # for this deployment. Unset SUBMISSIONS_OPEN means submissions are open
  # (workflows gate on != 'false'), and unset CATALOG_SHOWCASE correctly keeps
  # showcase-only build paths off outside the template repository.
  # Reissued 2026-09-28: PHCT_UPDATE_TOKEN is now a fine-grained token whose
  # resource owner is the Big-Cities-Health-Coalition organization, scoped to
  # this repository only (Contents, Pull requests, Workflows: read/write). The
  # issuing account and exact expiry are recorded outside this public
  # repository. Long term it should belong to a BCHC-controlled account.
  repository_secrets_present_not_values:
    - PHCT_UPDATE_TOKEN
  optional_secrets_supported:
    - CONTENT_BOT_TOKEN_optional
  token_owner: bchc_org_resource_owner_interim_maintainer_account
  token_expiry_reviewed: 2026-09-28

# Completed since 2026-08-22 and verified live on 2026-08-28:
# require_pull_requests_on_main, require_current_release_checks (7 contexts,
# strict), require_conversation_resolution, reduce_default_workflow_permissions
# (now read), enable_dependabot_alerts_and_security_updates,
# enable_private_vulnerability_reporting, establish_codeql_analysis (active),
# confirm_expected_repository_variables_or_document_defaults (documented above),
# reauthenticate_gh_cli_for_maintainable_release_operations.
open_admin_remediations:
  - require_one_or_more_human_approvals
  - disable_actions_pull_request_approval
  - add_immutable_release_tag_protection
  - confirm_notification_delivery_with_primary_and_backup_maintainers

