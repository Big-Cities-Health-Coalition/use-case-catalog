# ---------------------------------------------------------------------------
# Content model for catalog entries.
#
# EVERYTHING derives from this file:
#   - the entry detail page and the catalog cards        (_layouts/entry.html, _includes/entry-card.html)
#   - the filter panel and search index                  (_includes/facet-filters.html, _plugins/search_index.rb)
#   - the public /submit/ wizard                         (submit/index.md, assets/js/submit.js)
#   - the GitHub issue form (.github/ISSUE_TEMPLATE/new-entry.yml, generated by `npm run generate`)
#   - the issue -> pull request scaffolder               (scripts/new_entry_from_issue.mjs)
#   - front matter validation in CI                      (scripts/check_front_matter.rb)
#
# Field spec (each item under `fields`):
#   key         front matter key (snake_case, unique). Required.
#   label       human label shown everywhere. Required, must be unique.
#   prompt      optional question-style label used in the submission forms ("What kind of data does it touch?");
#               falls back to `label`. Keep `label` short for cards, filters and the detail page.
#   type        text | textarea | markdown | url | email | select | multiselect | list | date | number |
#               boolean | file | image | images | links
#                 - markdown: becomes the page BODY (only one field may be markdown)
#                 - multiselect: pick from `options`, stored as a YAML list
#                 - list: free-form, one per line (issue form) / comma separated (web form), stored as a YAML list
#                 - file: an attachment uploaded to the entry folder; `filename` sets the expected file name
#                 - image: path or URL to an image (used as thumbnail when key == "thumbnail")
#                 - images: a gallery — YAML list of image paths/URLs or {src, alt} items. Submitters drop
#                   images into the GitHub issue; the scaffolder downloads them into the entry folder.
#                 - links: labelled links — YAML list of {label, url}. Forms accept "Label | URL" per line.
#   required    true|false (default false)
#   description help that the prompt does not already give: a constraint, an example, a boundary.
#               Forms print it straight after the prompt, so it must not restate it.
#   error       optional message shown when a required answer is missing; overrides the generated
#               default ("Enter an answer for <prompt>"). Write it as verb + the thing.
#   placeholder example text shown in forms
#   options     list of allowed values (select / multiselect)
#   option_meta optional per-option presentation: { "<option>": {short, icon, tone, description} }
#                 short        <= 14 chars, replaces the option on badges/chips/filters
#                 icon         name from _includes/icon.html
#                 tone         neutral | primary | secondary | accent | warn (warn = caution only)
#                 description  one-line definition shown in forms and tooltips
#   facet       true -> appears in the filter panel. select => single-choice filter, others => multi-choice
#   card        true|false|badge|chip|meta|icon|line|fact -> how (and whether) the field shows on catalog cards.
#                 true keeps the type default (select => badge, text => meta, list/multiselect => chip).
#                 icon = the at-a-glance signal strip; line = one short line under the summary.
#                 fact = the ENTRY PAGE fact strip only, never the card — for a fact that
#                 decides a reuse question but does not survive a 288px card.
#   weight      1..9 (default 5). Ordering inside a card slot, the fact strip, a filter group and a
#               sidebar section; lower wins when a slot cap truncates.
#   icon        icon name for the field (filter group header, fact strip, card line/icon fallback)
#   group       key from `groups` below; drives filter-panel grouping and submit-wizard steps
#   search      true -> included in the search index (title + summary always are; facets always are)
#   form        false -> hidden from the submission forms (maintainer-only field, e.g. `featured`)
#   thumbnail   (file fields) true -> a thumb.jpg is generated from this PDF's first page in CI
#   escalate_on optional list of values that call for closer review (a boolean's `false`, a
#               select/multiselect option). The scaffolder lists every match on the pull request
#               and labels it `review:data-governance`; nothing else reads it.
#   links_entries (`list` fields only) true -> the values are slugs of other entries in this
#               catalog, so each one renders as a link to that entry and the entry named gets an
#               "Adopted by" card listing the entries that name it. A slug with no entry renders
#               as plain text rather than a dead link, and `npm run validate` fails it.
#
# `title`, `slug`, `summary`, `published`, `updated`, `thumbnail`, `featured` are always present
# in every entry, whether or not they are listed here.
# ---------------------------------------------------------------------------

entry:
  singular: "Use case"        # how one entry is referred to in the UI
  plural: "Use cases"
  path: "catalog"             # folder + URL base for entries (keep as "catalog" unless you know why)
  sort: "published"           # default catalog ordering key
  sort_order: "desc"          # asc | desc
  # Review status (optional). `status_key` names the select field the review
  # committee sets (it carries `form: false`, so submitters never see it) and
  # `deprecated_value` the option that means "kept for the record, no longer
  # current". When both are set, entries with that value get a notice on their
  # page and card, sort after everything else, and drop out of the featured
  # carousel and the hero panel; they stay in the catalog and the search index.
  # The scaffolder writes `status_scaffold_value` on new submissions and asks
  # the reviewer, in the pull request checklist, to set `status_approved_value`
  # before merging.
  status_key: "review_status"
  deprecated_value: "Deprecated"
  status_scaffold_value: "Under review"
  status_approved_value: "Reviewed & approved"
  # Minimum documentation bar (optional). When true, an entry with no `url`
  # field set and no `links` field populated fails validation instead of
  # drawing a warning. Off here on purpose: a member may share a use case as a
  # description alone, with no code, site or document to link to.
  require_link: false
  # Contributing organizations (optional). The field whose distinct values the
  # monthly metrics workflow (scripts/metrics.mjs) counts as "contributing
  # organizations" on the governance page — live entries only, sample content
  # excluded. Absent → the figure is not published.
  contributor_key: "organization"
  # Who to nudge when an entry goes stale (optional). Names the text field
  # holding the submitter's GitHub username, so the monthly refresh reminder can
  # @mention the person who wrote the entry instead of only the maintainers
  # (scripts/verification_sweep.mjs). Absent, or blank on an entry → the
  # reminder simply carries no personal mention. Never guessed from a value:
  # only the field named here is read as a handle.
  submitter_key: "submitter_github"
  # Who else runs this (optional). Names the `links` field that lists the other
  # organizations that deployed this use case, one item per organization
  # ({label, url} plus the optional `email` and `note` a `links` item may carry).
  # It is written only by the "Also deployed by" issue form
  # (.github/ISSUE_TEMPLATE/also-deployed-by.yml ->
  # .github/workflows/also-deployed-by.yml -> scripts/add_deployment_from_issue.mjs),
  # never by the public submission forms, which is why the field carries
  # `form: false`. Absent → the form reports that the feature is not configured
  # and the entry page shows no "add your organization" link.
  deployments_key: "also_deployed_by"
  # Where the code is (optional). Names the `url` field holding the project's
  # repository link. The monthly security-signals sweep
  # (scripts/security_signals.mjs -> .github/workflows/security-signals.yml)
  # reads it to know which repository to observe, and the entry page reads it to
  # know when to say that this catalog links to code it does not audit. A
  # pointer like `status_key` and `submitter_key`: nothing names the field
  # directly. Absent → the sweep reports that the feature is not configured and
  # writes nothing, and neither the "Security signals" card nor the
  # run-your-own-review line renders on any entry.
  repo_key: "repo_url"

# Ordered groups: { key, title, description?, icon?, placement? }.
# Filters show facet fields grouped this way; the submit wizard turns each group
# with form fields into a step. Fields with no group land in "other".
#   placement   rail | main (default main) -> on the entry page, `rail` groups become
#               sidebar cards instead of body sections. Keep it to the short,
#               act-on-it groups (links to reuse, who to contact); a 280px rail
#               cannot hold prose.
groups:
  - key: about
    title: "About"
    description: "What it is, who built it, and what it changed."
  - key: build
    title: "How it's built"
    description: "The tools and technologies behind it, any AI involved, and where it runs."
  - key: reuse
    title: "Reuse"
    description: "What it would take for another team to use this."
    placement: rail
  - key: sharing
    title: "Sharing & licensing"
    description: "What another health department can get from you, on what terms, and how portable it is."
    icon: share
  - key: cost
    title: "What it took"
    description: "Money, contracting and approvals — the part a budget or governance conversation needs."
    icon: credit-card
  - key: data
    title: "Data & access"
    description: "What data it touches and who sees the output."
  - key: contact
    title: "Contact"
    description: "Someone others can reach out to."
    placement: rail
  - key: story
    title: "The story"
    description: "Problem, approach, what it took, results and lessons."

fields:
  - key: title
    label: "Title"
    prompt: "What is it called?"
    type: text
    required: true
    group: about
    weight: 1
    placeholder: "Nightly lab-result pipeline for surveillance"
    description: "Specific enough that someone scanning a list of names knows what it is."

  - key: organization
    label: "Organization"
    prompt: "Which organization is sharing this?"
    type: text
    required: true
    group: about
    # Last in the About group on purpose: organization is a disambiguator, not
    # an entry point. At weight 2 the filter rail opened with a column of one-off
    # organization names and pushed "Public health area" below the fold.
    weight: 9
    facet: true
    card: meta
    search: true
    icon: building
    placeholder: "Chicago Department of Public Health"
    description: "A health department, city, agency or member organization."

  - key: solution_type
    label: "Type of solution"
    prompt: "What kind of solution is it?"
    type: multiselect
    required: true
    group: about
    weight: 3
    facet: true
    card: chip
    icon: layers
    options:
      - "AI/ML model"
      - "Generative AI tool"
      - "Data pipeline or integration"
      - "Analysis project or script"
      - "Dashboard or visualization"
      - "Application or software"
      - "Data platform or infrastructure"
      - "Workflow automation"
      - "Standards, governance or playbook"
    option_meta:
      "AI/ML model":
        icon: cpu
        description: "A trained model that predicts, classifies or detects something, such as a risk score or a forecast."
      "Generative AI tool":
        short: "Generative AI"
        icon: sparkles
        description: "Drafts, summarizes, translates or answers questions with a large language model."
      "Data pipeline or integration":
        short: "Data pipeline"
        icon: link
        description: "Moves, cleans or links data between systems: ETL jobs, feeds, HL7 or FHIR interfaces."
      "Analysis project or script":
        short: "Analysis"
        icon: terminal
        description: "R, Python, SAS or SQL code and notebooks that answer a question or produce a report."
      "Dashboard or visualization":
        short: "Dashboard"
        icon: chart-bar
        description: "A Power BI, Tableau, ArcGIS or custom dashboard, map or chart others can rebuild."
      "Application or software":
        short: "Application"
        icon: code
        description: "A web, mobile or desktop application that staff or residents use."
      "Data platform or infrastructure":
        short: "Data platform"
        icon: server
        description: "A warehouse, lakehouse, cloud environment or infrastructure-as-code other teams build on."
      "Workflow automation":
        short: "Automation"
        icon: wand
        description: "Takes a repetitive task off staff: Power Automate flows, scheduled jobs, robotic process automation."
      "Standards, governance or playbook":
        short: "Guidance"
        icon: book-open
        description: "A data standard, governance policy, checklist, template or implementation guide."
    description: "Select all that fit. A dashboard fed by a new pipeline is both."

  - key: sharing
    label: "What's shared"
    prompt: "What can another health department get from you?"
    type: select
    required: true
    group: sharing
    weight: 1
    facet: true
    card: badge                 # the first thing a reader looks for: what can I take away?
    icon: share
    options:
      - "Open-source code"
      - "Code on request"
      - "Templates or documentation only"
      - "Description only"
    option_meta:
      "Open-source code": { short: "Open source", icon: code, tone: primary, description: "The code is in a public repository anyone can copy." }
      "Code on request": { short: "On request", icon: lock, description: "The code exists and peer health departments can ask for it." }
      "Templates or documentation only": { short: "Templates/docs", icon: document, description: "Templates, configurations, specifications or a playbook, without code." }
      "Description only": { short: "Description", icon: book-open, description: "A write-up of what was built and what it took. Ask the contact for more." }
    description: "Code is optional. A clear account of what you built and what it took is worth sharing on its own."

  - key: use_case_category
    label: "AI use category"
    prompt: "If it involves AI, which of the four coalition categories fits best?"
    type: select
    group: about
    weight: 4
    facet: true
    icon: grid
    options:
      - "Administrative & task automation"
      - "Communications, media & writing"
      - "Coding & brainstorming"
      - "Operations & logistics"
    option_meta:
      "Administrative & task automation": { short: "Admin & tasks", description: "Forms, intake, scheduling, records — the routine work that eats staff time." }
      "Communications, media & writing": { short: "Communications", description: "Drafting, translating, summarising and publishing." }
      "Coding & brainstorming": { short: "Coding", description: "Writing or reviewing code, analysis, and idea generation." }
      "Operations & logistics": { short: "Operations", description: "Planning, dispatch, inventory, inspections and field work." }
    description: "For AI work only: the HHS-adapted categories the DMWG AI inventory uses. Leave it blank if no AI is involved."

  - key: area
    label: "Public health area"
    prompt: "Which public health areas does it serve?"
    type: multiselect
    required: true
    group: about
    weight: 5
    facet: true
    card: fact                  # the card's one chip family is `solution_type`
    icon: tag
    options:
      - "Communicable disease"
      - "Chronic disease and injury prevention"
      - "Environmental health"
      - "Maternal, child and family health"
      - "Access to and linkage with care"
      - "Emergency preparedness and response"
      - "Epidemiology and surveillance"
      - "Vital records and health statistics"
      - "Communications and community engagement"
      - "Data modernization and informatics"
      - "Agency operations and administration"
    option_meta:
      "Communicable disease": { short: "Communicable", description: "Infectious disease control, immunization, STI, HIV, TB and outbreak response." }
      "Chronic disease and injury prevention": { short: "Chronic/injury", description: "Chronic conditions, tobacco, nutrition, violence, overdose and injury prevention." }
      "Environmental health": { short: "Environmental", description: "Food safety, inspections, lead, housing, air and water quality, vectors, extreme heat." }
      "Maternal, child and family health": { short: "Maternal/child", description: "Home visiting, WIC, prenatal and infant health, school-age health." }
      "Access to and linkage with care": { short: "Access to care", description: "Clinics, community health workers, referrals and connecting residents to services." }
      "Emergency preparedness and response": { short: "Preparedness", description: "Planning for and responding to emergencies and public health incidents." }
      "Epidemiology and surveillance": { short: "Epidemiology", description: "Case, syndromic, laboratory and wastewater surveillance, and the analysis behind it." }
      "Vital records and health statistics": { short: "Vital records", description: "Birth and death records and the population health statistics built from them." }
      "Communications and community engagement": { short: "Communications", description: "Public information, risk communication, language access and community partnerships." }
      "Data modernization and informatics": { short: "Informatics", description: "Shared data systems, interoperability and data governance that serve more than one program." }
      "Agency operations and administration": { short: "Operations", description: "HR, finance, grants, procurement, contracts, IT and legal work that keeps the department running." }
    description: "Select all that fit. The first five follow the program areas of the Foundational Public Health Services; the rest are the capabilities every program relies on."

  - key: stage
    label: "Stage"
    prompt: "How far along is it?"
    type: select
    required: true
    group: about
    weight: 6
    facet: true
    card: meta
    icon: flag
    options:
      - "Idea / exploring"
      - "Pilot"
      - "In production"
      - "Paused or retired"
    option_meta:
      "Idea / exploring": { short: "Exploring", description: "Scoping or prototyping; nothing in regular use yet." }
      "Pilot": { description: "In limited use with real users while it is evaluated." }
      "In production": { short: "In production", tone: primary, description: "In regular, supported use." }
      "Paused or retired": { short: "Retired", description: "No longer active — shared for the lessons." }
    description: "Pick the stage that matches real use, not the plan."

  - key: summary
    label: "Summary"
    prompt: "In one or two sentences, what does it do?"
    type: textarea
    required: true
    group: about
    weight: 7
    description: "Shown on the catalog card. Plain language, no jargon."
    placeholder: "Pulls lab results from the state feed every night, removes duplicates and loads them into our surveillance system, so epidemiologists start the day with clean data."

  - key: impact
    label: "Result in one line"
    prompt: "What is the single most concrete result so far?"
    type: text
    group: about
    weight: 8
    card: line
    icon: trending-up
    search: true
    placeholder: "Cut brief turnaround from 3 days to 1 hour"
    description: "A number if you have one."

  - key: review_status
    label: "Review status"
    prompt: "Where is this entry in the coalition's review?"
    type: select
    form: false                 # set by the review committee in the pull request, never by the submitter
    group: about
    weight: 9                   # after organization (also 9): later in the file sorts later
    facet: true
    icon: shield-check
    options:
      - "Reviewed & approved"
      - "Under review"
      - "Revisions requested"
      - "Not yet reviewed"
      - "Deprecated"
    option_meta:
      "Reviewed & approved": { short: "Approved", tone: primary, description: "Passed intake and Governance Committee review." }
      "Under review": { description: "Published provisionally while the committee reviews it." }
      "Revisions requested": { short: "Revisions", tone: warn, description: "The committee has asked the submitter for changes." }
      "Not yet reviewed": { short: "Unreviewed", tone: warn, description: "Listed before any review took place." }
      "Deprecated": { tone: warn, description: "No longer maintained or accurate — kept for the record." }
    description: "Set by the review committee, not the submitter."

  - key: ai_role
    label: "Role of AI"
    prompt: "What part, if any, does AI play?"
    type: select
    group: build
    weight: 1
    facet: true
    icon: sparkles
    options:
      - "No AI"
      - "AI is part of the solution"
      - "AI helped build it"
      - "Both"
    option_meta:
      "No AI": { description: "Neither the solution nor the way it was built involved AI." }
      "AI is part of the solution": { short: "In solution", description: "The running system uses AI (a model, an assistant, an automation)." }
      "AI helped build it": { short: "Built with AI", description: "AI tools helped write the code, docs or analysis, but the solution itself doesn't use AI." }
      "Both": { description: "AI is in the solution and was used to build it." }
    description: "Most digital work involves no AI, and that is a fine answer."

  - key: ai_types
    label: "Types of AI"
    prompt: "If AI is involved, what kinds?"
    type: multiselect
    group: build
    weight: 2
    facet: true
    icon: cpu
    options:
      - "Generative text (LLM)"
      - "Chat assistant"
      - "Document Q&A (RAG)"
      - "Classification & NLP"
      - "Prediction & forecasting"
      - "Computer vision"
      - "Speech & transcription"
      - "Translation"
      - "Agents & automation"
      - "Rules-based (no ML)"
    option_meta:
      "Generative text (LLM)": { short: "Text (LLM)", description: "Drafts, summarizes or rewrites text with a large language model." }
      "Chat assistant": { short: "Chat", description: "A conversational interface for staff or the public." }
      "Document Q&A (RAG)": { short: "Document Q&A", description: "Answers questions from your own documents (retrieval-augmented generation)." }
      "Classification & NLP": { short: "Classification", description: "Sorts, tags or extracts information from text." }
      "Prediction & forecasting": { short: "Prediction", description: "Predicts risk, demand or trends from historical data." }
      "Computer vision": { short: "Vision", description: "Reads images, video or scanned documents." }
      "Speech & transcription": { short: "Speech", description: "Transcribes or understands spoken audio." }
      "Translation": { description: "Translates between languages." }
      "Agents & automation": { short: "Agents", description: "Multi-step automation where the AI takes actions." }
      "Rules-based (no ML)": { short: "Rules-based", description: "Deterministic logic, shared here for comparison." }
    description: "Select all that apply. Skip it when there is no AI."

  - key: ai_tools
    label: "Tools and technologies"
    prompt: "Which tools and technologies does it use?"
    type: list
    group: build
    weight: 3
    facet: true
    search: true
    icon: terminal
    placeholder: "R, Python, SAS, SQL Server, Power BI, FHIR, Azure OpenAI"
    description: "Name the languages, platforms, libraries, standards and AI models that matter."

  - key: platform
    label: "Where it runs"
    prompt: "Where does it run?"
    type: multiselect
    group: build
    weight: 4
    facet: true
    icon: server
    options:
      - "AWS"
      - "Microsoft Azure"
      - "Google Cloud"
      - "On-premises"
      - "Vendor / SaaS hosted"
      - "Enterprise AI workspace"
      - "Low-code platform"
      - "Desktop or local"
    option_meta:
      "Microsoft Azure": { short: "Azure" }
      "Google Cloud": { short: "GCP" }
      "On-premises": { short: "On-prem" }
      "Vendor / SaaS hosted": { short: "SaaS", description: "Runs on the vendor's infrastructure." }
      "Enterprise AI workspace": { short: "AI workspace", description: "Microsoft 365 Copilot, ChatGPT Enterprise, Gemini for Workspace and similar." }
      "Low-code platform": { short: "Low-code", description: "Power Platform, Airtable, n8n and similar." }
      "Desktop or local": { short: "Local", description: "Runs on a laptop or workstation." }
    description: "Select all that apply."

  - key: vendor
    label: "Vendor or partner"
    prompt: "If a vendor or partner built or hosts it, who?"
    type: text
    group: build
    weight: 5
    search: true
    placeholder: "Acme Health Data"
    description: "Leave it blank if your own team built it."

  - key: expertise
    label: "Skills needed to set it up"
    prompt: "Who is the least technical person who could get this running?"
    type: select
    required: true
    group: reuse
    weight: 1
    facet: true
    card: icon
    icon: academic-cap
    options:
      - "Anyone on staff"
      - "Power user"
      - "Analyst or data scientist"
      - "Developer"
      - "Contractor or vendor"
    option_meta:
      "Anyone on staff": { short: "Anyone", icon: user, description: "No technical skills — follow the instructions." }
      "Power user": { icon: adjustments, description: "Someone comfortable with spreadsheets, forms and low-code tools." }
      "Analyst or data scientist": { short: "Analyst", icon: chart-bar, description: "Someone who works in Python, R or SQL." }
      "Developer": { icon: code, description: "A software developer to deploy or adapt it." }
      "Contractor or vendor": { short: "Contractor", icon: wrench, description: "Outside help is required to stand this up." }
    description: "Judge it by setting the thing up, not by using it afterwards."

  - key: readiness
    label: "Readiness"
    prompt: "What would another team need before they could use this?"
    type: multiselect
    group: reuse
    weight: 2
    facet: true
    card: icon
    icon: rocket
    options:
      - "Ready to deploy"
      - "Guided setup"
      - "Needs customization"
      - "Needs a contractor"
      - "Needs a paid license"
      - "Needs a data agreement"
      - "Human review built in"
      - "Reference only"
    option_meta:
      "Ready to deploy": { short: "Ready", icon: rocket, tone: primary, description: "Can be used as-is with minimal configuration." }
      "Guided setup": { short: "Guided setup", icon: wand, description: "A wizard or script walks you through installation." }
      "Needs customization": { short: "Needs config", icon: adjustments, description: "Your team will need to adapt it before use." }
      "Needs a contractor": { short: "Needs vendor", icon: wrench, description: "Requires a contractor or vendor to implement." }
      "Needs a paid license": { short: "Paid license", icon: credit-card, description: "Depends on a paid product, API or subscription." }
      "Needs a data agreement": { short: "Data agreement", icon: document, description: "A data-sharing or BAA-type agreement is required." }
      "Human review built in": { short: "Human review", icon: eye, description: "A person checks the output before it is used." }
      "Reference only": { short: "Reference", icon: book-open, description: "Documentation and lessons — not something to deploy." }
    description: "Select all that apply."

  - key: repo_url
    label: "Source code"
    prompt: "If the code is public, where?"
    type: url
    group: reuse
    weight: 3
    icon: code
    placeholder: "https://github.com/your-org/your-project"
    description: "GitHub, GitLab, Azure DevOps or any public repository. Code is optional: leave this blank if you are not sharing it."

  - key: demo_url
    label: "Live site or demo"
    prompt: "Link to a live site or demo"
    type: url
    group: reuse
    weight: 4
    icon: globe
    placeholder: "https://example.org/app"

  - key: docs_url
    label: "Documentation or write-up"
    prompt: "Link to documentation, slides or a write-up"
    type: url
    group: reuse
    weight: 5
    icon: document
    placeholder: "https://example.org/docs"
    description: "A report, a blog post or a vendor case study all count."

  - key: resources
    label: "Other resources"
    prompt: "Anything else worth linking?"
    type: links
    group: reuse
    weight: 6
    icon: link
    placeholder: "Evaluation report | https://drive.google.com/…"
    description: "Shared drives, SharePoint, data dictionaries, model cards, container images, vendor pages."

  - key: screenshots
    label: "Screenshots"
    prompt: "Screenshots of it in use"
    type: images
    group: reuse
    weight: 7
    icon: image
    description: "Up to eight images, 15 MB total. No personal information visible."

  - key: deck_pdf
    label: "Slide deck or one-pager (PDF)"
    prompt: "Slide deck or one-pager"
    type: file
    filename: "deck.pdf"
    thumbnail: true
    group: reuse
    weight: 8
    icon: presentation

  - key: also_deployed_by
    label: "Also deployed by"
    prompt: "Who else is running this?"
    type: links
    form: false                 # written by the "Also deployed by" flow, never by the submitter
    group: reuse
    weight: 9
    icon: users
    # Searchable: the index flattens structured values (field_text in
    # _plugins/search_index.rb), so each deployment contributes its
    # organization name and note while its URL stays out of the index.
    search: true
    description: "Other organizations running this, maintained through the \"Also deployed by\" issue form."

  # ---------------------------------------------------------------------------
  # "What it took" (group: cost). The five fields below are a STARTING DRAFT for
  # the site owner to edit, not a standard: the dollar bands are a US-local
  # choice, and the review names ("Records retention review", "Research ethics /
  # IRB") are the ones a US public health department recognises. Rewrite the
  # options to match how your organization actually budgets, buys and approves —
  # nothing downstream depends on these particular strings.
  # ---------------------------------------------------------------------------
  - key: license
    label: "License"
    prompt: "Under what license is it shared?"
    type: select
    group: sharing
    weight: 2
    facet: true
    card: fact
    icon: document
    options:
      - "MIT"
      - "Apache 2.0"
      - "GPL / AGPL"
      - "Creative Commons (CC BY / CC0)"
      - "Other open license"
      - "Not open source — available on request"
      - "Not open source — description only"
    option_meta:
      "MIT": { tone: primary, description: "Permissive; reuse with attribution." }
      "Apache 2.0": { tone: primary, description: "Permissive, with a patent grant." }
      "GPL / AGPL": { description: "Copyleft — derivatives must stay open." }
      "Creative Commons (CC BY / CC0)": { short: "CC BY / CC0", tone: primary, description: "For documents, prompts, datasets and training material." }
      "Other open license": { short: "Other open", description: "Name it in the access terms below." }
      "Not open source — available on request": { short: "On request", description: "Peer jurisdictions can ask; say how in the access terms below." }
      "Not open source — description only": { short: "Write-up only", description: "The write-up is what is shared, not the artifact itself." }
    description: "Optional if only a description is shared. The coalition default is a permissive license (MIT, Apache 2.0, CC BY). Your organization keeps authorship."

  - key: access_terms
    label: "Access terms"
    prompt: "If it is not open source, how can a peer jurisdiction get access?"
    type: textarea
    group: sharing
    weight: 3
    placeholder: "Available to other health departments under a data-sharing agreement — email the contact below."
    description: "Government-to-government only, agreement required, contact us — whatever applies. Leave blank for open-licensed resources."

  - key: portability
    label: "Portable to other platforms"
    prompt: "Could it be adapted outside its original vendor ecosystem?"
    type: select
    required: true
    group: sharing
    weight: 4
    facet: true
    card: fact
    icon: server
    options:
      - "Yes — platform-agnostic"
      - "Partially — with rework"
      - "No — tied to its platform"
    option_meta:
      "Yes — platform-agnostic": { short: "Portable", tone: primary, description: "Runs on any comparable stack with configuration changes only." }
      "Partially — with rework": { short: "With rework", description: "Some pieces are vendor-specific and would need swapping." }
      "No — tied to its platform": { short: "Platform-tied", description: "Depends on one vendor's services end to end." }
    description: "Microsoft-built but portable to AWS is 'partially'."

  - key: portability_notes
    label: "Portability notes"
    prompt: "What would porting it involve?"
    type: textarea
    group: sharing
    weight: 5
    placeholder: "The R scripts and the data dictionary run anywhere; the nightly schedule uses Azure Data Factory and would need replacing."
    description: "Which pieces are vendor-specific, and what a team on a different stack would need to swap."

  - key: reused_from
    label: "Adapted from"
    prompt: "Did you adapt this from another entry in this catalog?"
    type: list
    group: sharing
    weight: 6
    links_entries: true
    search: false
    placeholder: "overdose-spike-brief"
    description: "Name it by its slug, the last part of its URL. That entry will show it was adopted by yours."

  - key: cost_band
    label: "Cost to stand up"
    prompt: "Roughly what did it cost to get it running the first time?"
    type: select
    group: cost
    weight: 1
    facet: true
    card: fact
    icon: credit-card
    options:
      - "No new spend"
      - "Under $25k"
      - "$25k–$100k"
      - "$100k–$500k"
      - "Over $500k"
      - "Not disclosed"
    option_meta:
      "No new spend": { tone: primary, description: "Built with licences, staff and infrastructure the organization already had." }
      "Not disclosed": { description: "The submitter cannot share cost publicly. Ask the contact." }
    description: "One-time cost: contracts, build, implementation. A band is fine — nobody expects an exact figure."

  - key: run_cost
    label: "Cost to keep running"
    prompt: "What does a normal year cost to run?"
    type: select
    group: cost
    weight: 2
    facet: true
    icon: clock
    options:
      - "No ongoing cost"
      - "Under $10k/yr"
      - "$10k–$50k/yr"
      - "Over $50k/yr"
      - "Not disclosed"
    option_meta:
      "No ongoing cost": { short: "No run cost", tone: primary }
      "Not disclosed": { description: "The submitter cannot share cost publicly. Ask the contact." }
    description: "Licences, hosting and usage charges only — staff time belongs in the write-up."

  - key: procurement
    label: "How it was bought"
    prompt: "How was this paid for or contracted?"
    type: multiselect
    group: cost
    weight: 3
    facet: true
    icon: document
    options:
      - "No procurement needed"
      - "Existing enterprise licence"
      - "Cooperative or piggyback contract"
      - "Competitive solicitation"
      - "Sole source"
      - "Grant funded"
      - "Interagency agreement"
      - "In-kind or academic partnership"
    option_meta:
      "No procurement needed": { short: "None needed" }
      "Existing enterprise licence": { short: "Already owned", description: "Covered by a contract the organization already held." }
      "Cooperative or piggyback contract": { short: "Cooperative", description: "Bought off another jurisdiction's or a co-op's contract." }
      "Competitive solicitation": { short: "Competitive", description: "An RFP, RFQ or equivalent open competition." }
      "Sole source": { description: "Awarded without competition, with a written justification." }
      "Grant funded": { short: "Grant" }
      "Interagency agreement": { short: "Interagency", description: "Paid through an agreement with another public agency." }
      "In-kind or academic partnership": { short: "Partnership" }
    description: "Select all that apply. This is the question peers ask most and the one that is hardest to find out."

  - key: approvals
    label: "Reviews it went through"
    prompt: "Which internal reviews or approvals did it need?"
    type: multiselect
    group: cost
    weight: 4
    facet: true
    card: fact
    icon: shield-check
    options:
      - "Privacy review"
      - "Security review or authority to operate"
      - "Legal or contracts review"
      - "Records retention review"
      - "Labor or workforce consultation"
      - "Community or advisory review"
      - "Equity impact assessment"
      - "Research ethics / IRB"
      - "AI governance body"
      - "None required"
      - "Not yet reviewed"
    option_meta:
      "Security review or authority to operate": { short: "Security", description: "A security assessment, ATO or equivalent sign-off." }
      "Legal or contracts review": { short: "Legal" }
      "Records retention review": { short: "Records", description: "Confirmed how long the outputs must be kept and where." }
      "Labor or workforce consultation": { short: "Labor", description: "Discussed with the union or the affected staff before rollout." }
      "Community or advisory review": { short: "Community", icon: users }
      "Equity impact assessment": { short: "Equity review", icon: users }
      "Research ethics / IRB": { short: "IRB" }
      "AI governance body": { short: "AI governance", description: "An internal AI review board or committee signed off." }
      "Not yet reviewed": { short: "No review yet", tone: warn, description: "Shared honestly — this has not been through a formal review." }
    description: "Select all that apply. Saying 'not yet reviewed' is more useful to a peer than leaving it blank."

  - key: equity_note
    label: "Who it affects"
    prompt: "Who could this help or harm, and how did you check?"
    type: textarea
    group: cost
    weight: 5
    placeholder: "Covers every case reported by the labs we onboarded. Smaller labs that still fax results are not included yet, so counts undercount the neighborhoods they serve; we track that gap each quarter."
    description: "Optional but strongly encouraged. Which populations the output reaches, who it might miss or serve less well, and what you would watch."

  - key: no_pii_attestation
    label: "No PII/PHI in the shared material"
    prompt: "Do you confirm that no personal or protected health information appears in the resource, its documentation, example data or screenshots?"
    type: boolean
    required: true
    group: data
    weight: 1
    icon: shield-check
    escalate_on: [false]
    description: "Reviewers spot-check. If the answer is no, redact first."

  - key: data_sensitivity
    label: "Data it touches"
    prompt: "What kind of data does it touch?"
    type: multiselect
    required: true
    group: data
    weight: 2
    facet: true
    card: icon
    icon: shield
    options:
      - "Public data only"
      - "De-identified data"
      - "Internal, non-public data"
      - "Personal information (PII)"
      - "Health information (PHI)"
      - "Criminal justice data (CJIS)"
    option_meta:
      "Public data only": { short: "Public data", icon: globe, description: "Only data that is already public." }
      "De-identified data": { short: "De-identified", icon: shield-check, description: "Personal identifiers removed before use." }
      "Internal, non-public data": { short: "Internal data", icon: lock, description: "Non-public operational data without personal identifiers." }
      "Personal information (PII)": { short: "PII", icon: shield, tone: warn, description: "Names, addresses, IDs or other personal identifiers." }
      "Health information (PHI)": { short: "PHI", icon: shield, tone: warn, description: "Identifiable health information covered by HIPAA." }
      "Criminal justice data (CJIS)": { short: "CJIS", icon: shield, tone: warn, description: "Data subject to CJIS security policy." }
    escalate_on: ["Personal information (PII)", "Health information (PHI)", "Criminal justice data (CJIS)"]
    description: "Select all that apply. This helps others judge governance and approval effort."

  - key: data_sources
    label: "Data sources"
    prompt: "Which data sources does it use?"
    type: list
    group: data
    weight: 3
    search: true
    icon: database
    placeholder: "Electronic lab reports (ELR), immunization registry, ESSENCE"
    description: "Describe the sources — do not paste sensitive data."

  - key: audience
    label: "Who sees the output"
    prompt: "Who sees the output?"
    type: select
    required: true
    group: data
    weight: 4
    facet: true
    card: icon
    icon: users
    options:
      - "Public-facing"
      - "Internal staff"
      - "Partner organizations"
    option_meta:
      "Public-facing": { short: "Public", icon: globe, description: "Residents or the general public interact with it." }
      "Internal staff": { short: "Internal", icon: lock, description: "Used only inside the organization." }
      "Partner organizations": { short: "Partners", icon: users, description: "Shared with specific partner organizations." }
    escalate_on: ["Public-facing"]
    description: "Pick the widest group that sees anything it produces."

  - key: data_governance_notes
    label: "Data-governance caveats"
    prompt: "Anything a reusing jurisdiction should know about data handling?"
    type: textarea
    group: data
    weight: 5
    placeholder: "Outputs are retained 90 days under our records schedule; the matching rules were tuned to our own registry, so expect to re-tune them."
    description: "Data-use agreements, retention rules, de-identification steps — the caveats that travel with the resource."

  - key: security_review
    label: "Security review"
    prompt: "How much has anybody looked at this code?"
    type: select
    form: false                 # set by maintainers in the pull request, never by the submitter
    group: data
    weight: 6
    facet: true
    card: fact                  # the entry page's fact strip; a 288px card has no room for the caveat
    icon: shield-check
    options:
      - "Coalition security-reviewed"
      - "Automated checks only"
      - "Not reviewed"
    option_meta:
      "Coalition security-reviewed": { short: "Sec-reviewed", tone: primary, description: "A coalition maintainer read this project's security practices — its policy, its dependencies, how it handles data — on the date recorded in the pull request. It is a point-in-time reading of practices, not an audit of the code and not a guarantee that it is safe to run." }
      "Automated checks only": { short: "Auto checks", description: "Nobody has reviewed this project. All that is recorded is what the monthly sweep could observe from the outside — repository activity, license, security policy, public OpenSSF Scorecard — and none of that inspects what the code does." }
      "Not reviewed": { short: "Not reviewed", tone: warn, description: "Nobody has looked at this project on the catalog's behalf. Treat the link as a starting point for your own review, not as a recommendation." }
    description: "Set by maintainers, not the submitter. None of these values means the code is safe to run — run your own security review before deploying."

  - key: contact_name
    label: "Contact name"
    prompt: "Who can people contact?"
    type: text
    required: true
    group: contact
    weight: 1
    placeholder: "Jordan Lee"
    description: "Someone happy to answer questions from another team."

  - key: contact_title
    label: "Contact title"
    prompt: "What is their role or title?"
    type: text
    group: contact
    weight: 2
    placeholder: "Informatics Manager"
    description: "So a peer knows who they are writing to."

  - key: contact_email
    label: "Contact email"
    prompt: "What is their email?"
    type: email
    required: true
    group: contact
    weight: 3
    placeholder: "jordan.lee@city.gov"

  - key: submitter_github
    label: "GitHub username"
    prompt: "Your GitHub username (optional)"
    type: text
    group: contact
    weight: 4
    search: false
    placeholder: "jordan-lee"
    description: "Used once a year, when this entry is due to be re-confirmed, so the reminder reaches you. Leave it blank to send it to the maintainers only."

  - key: write_up
    label: "Full write-up"
    prompt: "What's the story?"
    type: markdown
    required: true
    group: story
    weight: 1
    description: "Markdown is supported. Suggested headings: Problem, Approach, Time and resources (data, staffing, cost), Results, Lessons learned, How to reuse."
    placeholder: |
      ## Problem

      ## Approach

      ## Time and resources

      ## Results

      ## Lessons learned

      ## How to reuse this
