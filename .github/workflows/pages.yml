# Builds the site and publishes it to GitHub Pages on every push to main.
#
# One `jekyll build`, with one exception: the template's own deployment is a
# showcase — a landing page at the root and a complete live example of every
# preset under /examples/<preset-id>/ (docs/showcase-plan.md). The canonical
# `crypticpy/phct` repository builds it whenever `_data/site.yml` still says
# `demo: true`; another repository opts in with CATALOG_SHOWCASE. A normal fork
# never gets the showcase — not even in the window between turning Pages on and
# running `npm run eject:samples` (which writes `demo: false`).
name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Each job declares exactly the scopes it needs; `pages: write` and
# `id-token: write` belong to the deploy job alone.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # `updated` is the date an entry's text last changed — the entry page shows
  # it, "Recently updated" sorts by it, the feed and the staleness notice read
  # it. Edits reach main from many directions and nobody bumps a date by hand,
  # so the deploy that publishes a change prepares the stamp: for every entry
  # file this push *modified* (not added — a new entry has `published`) that is
  # not sample content, scripts/stamp_updated.mjs sets `updated:` to today
  # unless it already says today or later. The workflow opens or updates a
  # small follow-up pull request instead of bypassing review on protected main.
  #
  # Never a reason for a deploy to fail: the job is continue-on-error, and the
  # site deploys the reviewed main commit while the optional date-only PR waits
  # for its own checks and review.
  stamp:
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore(entries): stamp updated')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff needs the commit the push started from.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Stamp `updated` on the entries this push edited
        id: stamp
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/stamp_updated.mjs "$BEFORE" "$AFTER"

      - name: Open or update the entry-date pull request
        id: cpr
        if: steps.stamp.outputs.count != '' && steps.stamp.outputs.count != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/stamp-entry-updates
          commit-message: "chore(entries): stamp updated dates"
          title: "Stamp updated dates on edited entries"
          body: |
            The last merged change edited ${{ steps.stamp.outputs.count }} existing
            catalog entry or entries. This maintenance PR applies today's
            `updated:` date without bypassing the protected default branch.

            Files:
            ```text
            ${{ steps.stamp.outputs.stamped }}
            ```
          add-paths: |
            ${{ steps.stamp.outputs.stamped }}
          delete-branch: true

      - name: Run the required checks on the entry-date branch
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN }}
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: |
          set -euo pipefail
          if [ -n "$BOT_TOKEN" ]; then
            echo "CONTENT_BOT_TOKEN is set, so the pull request triggers its own checks." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Checks dispatched on \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          for workflow in validate.yml quality.yml lint-workflows.yml; do
            if gh workflow run "$workflow" --ref "$BRANCH"; then
              echo "- \`$workflow\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$workflow\` could not be dispatched; approve the parked run from the Actions tab." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Link the entry-date pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          COUNT: ${{ steps.stamp.outputs.count }}
        run: |
          echo "Prepared updated dates for $COUNT existing entries: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error keeps a failure here from turning the deploy red, but
      # it also makes the failure invisible — and `updated:` dates that quietly
      # stop advancing later read as stale entries in the verification sweep.
      - name: Explain a stamp that could not be prepared
        if: failure()
        run: |
          echo "Could not prepare updated-date stamps this deploy; the site itself deploys as normal. If this repeats, check Settings -> Actions -> General -> Workflow permissions (\"Allow GitHub Actions to create and approve pull requests\")." >> "$GITHUB_STEP_SUMMARY"

  build:
    # Runs whether or not the stamp job ran, failed, or was skipped. Publication
    # always uses the reviewed commit that triggered this workflow; the optional
    # date-only follow-up cannot bypass review by changing the deployed SHA.
    needs: stamp
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci

      - name: Regenerate schema-derived files
        run: node scripts/generate.mjs

      - name: Build CSS
        run: npm run build:css

      - name: Resolve site URL
        id: site
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          # Work out where the site will be served from:
          #  - a CNAME file means a custom domain at the root,
          #  - a <user>.github.io repository is served from the domain root,
          #  - anything else lives under /<repo-name>/.
          if [[ -f CNAME ]]; then
            site_url="https://$(tr -d '[:space:]' < CNAME)"
            baseurl=""
          elif [[ "$repo_name" == *.github.io ]]; then
            site_url="https://${repo_name}"
            baseurl=""
          else
            site_url="https://${owner}.github.io"
            baseurl="/$repo_name"
          fi
          # An explicit url in _config.yml always wins.
          configured_url="$(ruby -ryaml -e 'puts YAML.load_file("_config.yml")["url"].to_s')"
          if [[ -n "$configured_url" ]]; then site_url="$configured_url"; fi
          printf 'url: "%s"\nbaseurl: "%s"\n' "$site_url" "$baseurl" > _config.ci.yml
          {
            echo "url=$site_url"
            echo "baseurl=$baseurl"
          } >> "$GITHUB_OUTPUT"
          echo "Building with url='${site_url}' baseurl='${baseurl}'"

      # Demo content is what makes this deployment the showcase (see the header
      # comment). `demo` is read from _data/site.yml the same way the url is
      # read from _config.yml above, so nothing has to be kept in step here.
      - name: Decide whether to build the showcase
        id: showcase
        env:
          CATALOG_SHOWCASE: ${{ vars.CATALOG_SHOWCASE }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          demo="$(ruby -ryaml -e 'puts YAML.load_file("_data/site.yml")["demo"] == true')"
          build=false
          if [[ "$demo" == "true" && ( "$REPOSITORY" == "crypticpy/phct" || "$CATALOG_SHOWCASE" == "true" ) ]]; then
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Showcase: $build (repository=$REPOSITORY, demo=$demo, CATALOG_SHOWCASE='${CATALOG_SHOWCASE}')"

      - name: Smoke check configuration
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll doctor --config _config.yml,_config.ci.yml

      - name: Build Jekyll site
        if: steps.showcase.outputs.build != 'true'
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site --config _config.yml,_config.ci.yml

      # The landing into _site and every example into _site/examples/<id>, each
      # a full build of this repository with that preset overlaid.
      - name: Build the showcase
        if: steps.showcase.outputs.build == 'true'
        env:
          JEKYLL_ENV: production
          SITE_URL: ${{ steps.site.outputs.url }}
          SITE_BASEURL: ${{ steps.site.outputs.baseurl }}
        run: node scripts/build_showcase.mjs --destination _site --url "$SITE_URL" --baseurl "$SITE_BASEURL"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A contributor opens an issue, a bot says a pull request is open, and then
  # nothing — their entry goes live and they are never told. For a catalog that
  # runs on peer contribution that message is the whole retention mechanism, so
  # it is sent from the deploy that actually published the page.
  announce:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    # Never let a courtesy comment turn a successful deploy red.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the entry path from the schema
        id: entry-path
        run: |
          set -euo pipefail
          echo "value=$(ruby -ryaml -e 'puts((YAML.load_file("_data/schema.yml")["entry"] || {})["path"] || "catalog")')" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # Marks each merged submission's issue status:published and, for a new
      # entry, says where it is live (once per issue; a re-run deploy does not
      # repeat it). Wording: scripts/lib/notify.mjs.
      - name: Tell the submitter their entry is live
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          ENTRY_PATH: ${{ steps.entry-path.outputs.value }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.announcePublished({
              github, context, core,
              pageUrl: process.env.PAGE_URL,
              entryPath: process.env.ENTRY_PATH
            });
