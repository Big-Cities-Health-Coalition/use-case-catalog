name: New event from issue

on:
  issues:
    types:
      - opened
      - edited

# Set the repository variable SUBMISSIONS_OPEN to `false` to accept issues from
# members and collaborators only; leaving it unset keeps them open.
#
# Optional secret CONTENT_BOT_TOKEN: see .github/workflows/new-entry.yml and
# docs/admin-guide.md § One-time repository setup.
#
# The jobs below declare exactly the scopes they need; nothing is granted by default.
permissions: {}

# One run per issue: editing an issue three times in a minute must not leave
# three jobs force-pushing the same branch at each other.
concurrency:
  group: new-event-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  scaffold:
    # `state == 'open'` matters: editing a closed, already-handled issue would
    # otherwise force-push its branch again and try to edit a merged pull request.
    if: >-
      github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'content:new-event')
      && (vars.SUBMISSIONS_OPEN != 'false'
          || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Dispatching validate.yml/quality.yml onto the generated branch.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The push below needs credentials; the checkout keeps them on purpose.
          # zizmor: ignore[artipacked]
          token: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Mark the submission received
        if: github.event.action == 'opened'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.notifyIssue({ github, context, core, status: notify.STATUS.received });

      - name: List the events already scheduled for this year
        id: list
        if: github.event.action == 'opened'
        run: node scripts/list_events_for_year.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      # Reference material, posted once. It used to repeat on every edit, so
      # correcting a typo buried the automation's real answer under a copy of
      # a list the submitter had already read.
      - name: Comment with the existing schedule for reference
        if: github.event.action == 'opened'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LIST_YEAR: ${{ steps.list.outputs.year }}
          LIST_EVENTS: ${{ steps.list.outputs.events_md }}
        with:
          script: |
            const body = [
              `### Events currently scheduled for ${process.env.LIST_YEAR}`,
              '',
              process.env.LIST_EVENTS,
              '',
              'Leave **Event ID** blank to generate one from the title, or reuse an ID above to match the schedule.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Scaffold event page
        id: scaffold
        continue-on-error: true
        run: node scripts/new_event_from_issue.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}

      - name: Report the failure on the issue
        if: steps.scaffold.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STEP_ERROR: ${{ steps.scaffold.outputs.error }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            const detail = process.env.STEP_ERROR || 'The step failed; see the workflow logs for details.';
            await notify.notifyIssue({ github, context, core, kind: 'scaffold_failed', vars: { reason: detail } });
            core.setFailed(detail);

      # The branch is event/<year>-<event id>, and the id comes from the title
      # unless the form names one, so an edited title proposes a new branch.
      # One issue keeps one draft: an open draft for this issue keeps its
      # branch, which is rebuilt (or held, below) with the new folder. See
      # scripts/lib/drafts.mjs.
      - name: Find the draft already open for this issue
        id: draft
        if: steps.scaffold.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROPOSED: ${{ steps.scaffold.outputs.branch }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const drafts = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/drafts.mjs`).href);
            const { branch } = await drafts.findDraftBranch({
              github, context, core,
              proposed: process.env.PROPOSED,
              label: 'content:new-event',
              prefix: 'event/'
            });
            core.setOutput('branch', branch);

      # An edit to the issue re-runs this job, which rebuilds the branch and
      # force-pushes it. Once a reviewer has committed to it that would erase
      # their work, so it is only rebuilt while every commit on it is the
      # automation's. See scripts/branch_guard.mjs.
      - name: Check the draft branch is still the automation's
        id: guard
        if: steps.scaffold.outcome == 'success'
        env:
          BRANCH: ${{ steps.draft.outputs.branch }}
        run: node scripts/branch_guard.mjs

      - name: Hand the edit to the reviewer
        if: steps.guard.outputs.held == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH: ${{ steps.draft.outputs.branch }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.holdEdit({ github, context, core, branch: process.env.BRANCH });

      # This job pushes the branch itself rather than through
      # peter-evans/create-pull-request, which re-fetches the branch and
      # force-pushes over whatever it found, so a reviewer push between the
      # guard and that fetch would be lost. Here the lease is the
      # remote-tracking ref the guard read: a reviewer push since then makes
      # the push fail instead of vanishing.
      - name: Commit the event on its branch
        id: commit
        if: steps.scaffold.outcome == 'success' && steps.guard.outputs.held != 'true'
        env:
          BRANCH: ${{ steps.draft.outputs.branch }}
          SLUG: ${{ steps.scaffold.outputs.slug }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # `git add -A` is safe only because this step is gated on the
          # scaffolder having succeeded, and it is what create-pull-request
          # committed before: everything the scaffolder wrote.
          git add -A
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "The scaffolder produced no changes." >&2
            exit 0
          fi
          git commit -m "feat: add event $SLUG"
          # The branch is machine-generated, so an `issues: edited` re-run
          # replaces its contents rather than merging.
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        id: pr
        if: steps.commit.outputs.created == 'true'
        env:
          # With CONTENT_BOT_TOKEN the pull request has a real author and the
          # normal `pull_request` triggers fire; without it the step below
          # dispatches the checks by hand.
          GH_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.draft.outputs.branch }}
          SLUG: ${{ steps.scaffold.outputs.slug }}
          YEAR: ${{ steps.scaffold.outputs.year }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          printf 'Generated from issue #%s.\n\nCloses #%s\n' "$ISSUE_NUMBER" "$ISSUE_NUMBER" > /tmp/pr-body.md
          title="Add event: $YEAR $SLUG"
          # An `issues: edited` re-run reuses the open pull request on this
          # branch. `--state open` matters: a closed or merged one must not be
          # edited in place of opening the draft.
          url="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)"
          if [ -n "$url" ]; then
            gh pr edit "$url" --title "$title" --body-file /tmp/pr-body.md --add-label content:new-event
            echo "operation=updated" >> "$GITHUB_OUTPUT"
          else
            url="$(gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH" \
              --title "$title" \
              --label content:new-event \
              --body-file /tmp/pr-body.md)"
            echo "operation=created" >> "$GITHUB_OUTPUT"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # A pull request opened with GITHUB_TOKEN does not trigger `pull_request`
      # workflows; GitHub parks them behind "Approve and run". `workflow_dispatch`
      # is the documented exception, and its check runs bind to the branch head
      # SHA — the pull request's head SHA — so they appear in its Checks tab.
      # See .github/workflows/new-entry.yml for the long version.
      - name: Run the content checks on the new branch
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN }}
          BRANCH: ${{ steps.draft.outputs.branch }}
        run: |
          set -euo pipefail
          if [ -n "$BOT_TOKEN" ]; then
            echo "CONTENT_BOT_TOKEN is set, so the pull request triggers its own checks." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Checks dispatched on \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          for workflow in validate.yml quality.yml lint-workflows.yml; do
            if gh workflow run "$workflow" --ref "$BRANCH"; then
              echo "- \`$workflow\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$workflow\` could not be dispatched; approve the parked run from the Actions tab." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Link the pull request from the issue
        if: steps.pr.outputs.url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_OPERATION: ${{ steps.pr.outputs.operation }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            // An edited issue updates the existing pull request; say that
            // instead of repeating the full first-time comment.
            const created = process.env.PR_OPERATION === 'created';
            await notify.notifyIssue({
              github, context, core,
              kind: created ? 'draft_ready' : 'draft_updated',
              status: notify.STATUS.inReview,
              prUrl: process.env.PR_URL,
              mention: notify.submitter(context),
              vars: {
                details: created
                  ? 'To attach slides or a PDF afterwards, use the **Update event attachments** form.'
                  : 'The diff there now shows the new details.'
              }
            });

      # The steps above can still leave the issue silent if the pull request
      # itself is refused — most often because "Allow GitHub Actions to create
      # and approve pull requests" was never ticked.
      - name: Say the pull request could not be opened
        if: failure() && steps.scaffold.outcome != 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.notifyIssue({ github, context, core, kind: 'pr_failed' });
