name: Scaffold new cohort year

on:
  issues:
    types:
      - opened
      - edited
  workflow_dispatch:
    inputs:
      year:
        description: "Cohort year to scaffold (YYYY)"
        required: true
        type: string

# Set the repository variable SUBMISSIONS_OPEN to `false` to accept issues from
# members and collaborators only; leaving it unset keeps them open.
#
# Replies on the issue come from scripts/lib/notify.mjs and keep one
# `status:*` label on it (see new-entry.yml).
#
# The jobs below declare exactly the scopes they need; nothing is granted by default.
permissions: {}

# One run per issue (or per manually-dispatched year): editing an issue three
# times in a minute must not leave three jobs force-pushing the same branch
# at each other.
concurrency:
  group: new-year-${{ github.event.issue.number || inputs.year || github.run_id }}
  cancel-in-progress: true

jobs:
  scaffold:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.issue.state == 'open'
          && contains(github.event.issue.labels.*.name, 'content:new-year')
          && (vars.SUBMISSIONS_OPEN != 'false'
              || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Dispatching validate.yml/quality.yml onto the generated branch.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The push below needs credentials; the checkout keeps them on purpose.
          # zizmor: ignore[artipacked]
          token: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Mark the submission received
        if: github.event_name == 'issues' && github.event.action == 'opened'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.notifyIssue({ github, context, core, status: notify.STATUS.received });

      - name: Read the cohort year from the issue
        if: github.event_name == 'issues'
        id: extract
        run: node scripts/extract_event_fields.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0

      - name: Resolve the year
        id: year
        continue-on-error: true
        env:
          DISPATCH_YEAR: ${{ inputs.year }}
          ISSUE_YEAR: ${{ steps.extract.outputs.cohort_year }}
        run: |
          set -euo pipefail
          year="${DISPATCH_YEAR:-$ISSUE_YEAR}"
          if ! echo "$year" | grep -Eq '^[0-9]{4}$'; then
            echo "Could not read a four-digit cohort year (got '$year')." >&2
            # A fixed sentence, not the value that was typed: this output is
            # quoted back onto the issue, and the message is the whole of what
            # the person who filled the form gets to read.
            echo "error=The **Cohort Year** field needs a four-digit year, like 2026. Edit this issue to fix it and the automation will try again." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "value=$year" >> "$GITHUB_OUTPUT"

      - name: Scaffold cohort
        id: scaffold
        if: steps.year.outcome == 'success'
        continue-on-error: true
        run: ruby scripts/scaffold_year.rb
        env:
          COHORT_YEAR: ${{ steps.year.outputs.value }}
          COHORT_INTRO: ${{ steps.extract.outputs.intro }}

      # Both steps above are `continue-on-error`, so the issue hears about the
      # problem in plain English before the job stops. Without this the run just
      # went red and the issue sat there with nothing on it at all.
      - name: Report the failure on the issue
        if: github.event_name == 'issues' && (steps.year.outcome == 'failure' || steps.scaffold.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STEP_ERROR: ${{ steps.year.outputs.error || steps.scaffold.outputs.error }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            const detail = process.env.STEP_ERROR || 'The step failed; see the workflow logs for details.';
            await notify.notifyIssue({ github, context, core, kind: 'scaffold_failed', vars: { reason: detail } });
            core.setFailed(detail);

      # A dispatch has no issue to comment on, so it still has to fail loudly.
      - name: Stop when the scaffolding failed
        if: github.event_name != 'issues' && (steps.year.outcome == 'failure' || steps.scaffold.outcome == 'failure')
        run: |
          echo "The year could not be resolved or scaffolded; see the steps above." >&2
          exit 1

      # An edit to the issue re-runs this job, which rebuilds the branch and
      # force-pushes it. Once a reviewer has committed to it that would erase
      # their work, so it is only rebuilt while every commit on it is the
      # automation's. See scripts/branch_guard.mjs.
      - name: Check the draft branch is still the automation's
        id: guard
        if: steps.scaffold.outputs.created == 'true'
        env:
          BRANCH: cohort/${{ steps.year.outputs.value }}
        run: node scripts/branch_guard.mjs

      - name: Hand the edit to the reviewer
        if: github.event_name == 'issues' && steps.guard.outputs.held == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH: cohort/${{ steps.year.outputs.value }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.holdEdit({ github, context, core, branch: process.env.BRANCH });

      # This job pushes the branch itself rather than through
      # peter-evans/create-pull-request, which re-fetches the branch and
      # force-pushes over whatever it found, so a reviewer push between the
      # guard and that fetch would be lost. Here the lease is the
      # remote-tracking ref the guard read: a reviewer push since then makes
      # the push fail instead of vanishing.
      - name: Commit the cohort on its branch
        id: commit
        if: steps.scaffold.outputs.created == 'true' && steps.guard.outputs.held != 'true'
        env:
          BRANCH: cohort/${{ steps.year.outputs.value }}
          COHORT_YEAR: ${{ steps.year.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # `git add -A` is safe only because this step is gated on the
          # scaffolder having created the year, and it is what
          # create-pull-request committed before: everything it wrote.
          git add -A
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "The scaffolder produced no changes." >&2
            exit 0
          fi
          git commit -m "chore: scaffold cohort $COHORT_YEAR"
          # The branch is machine-generated, so a re-run replaces its contents
          # rather than merging.
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        id: pr
        if: steps.commit.outputs.created == 'true'
        env:
          # With CONTENT_BOT_TOKEN the pull request has a real author and the
          # normal `pull_request` triggers fire; without it the step below
          # dispatches the checks by hand.
          GH_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: cohort/${{ steps.year.outputs.value }}
          COHORT_YEAR: ${{ steps.year.outputs.value }}
          # Empty for a dispatch from the Actions tab, which has no issue.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Everything between the braces is literal markdown; a backtick here is
          # a code span, not a command substitution.
          # shellcheck disable=SC2016
          {
            if [ -n "$ISSUE_NUMBER" ]; then
              printf 'Generated from issue #%s.\n\nCloses #%s\n\n' "$ISSUE_NUMBER" "$ISSUE_NUMBER"
            else
              printf 'Started from the Actions tab.\n\n'
            fi
            printf 'Scaffolds `cohorts/%s/` and `_data/cohorts/%s.yml`.\n\n' "$COHORT_YEAR" "$COHORT_YEAR"
            printf '### Maintainer checklist\n'
            printf -- '- [ ] Replace the placeholder intro on the cohort landing page\n'
            printf -- '- [ ] Replace the placeholder events with the real schedule\n'
            printf -- '- [ ] Merge to publish\n'
          } > /tmp/pr-body.md
          title="Scaffold cohort $COHORT_YEAR"
          # A re-run reuses the open pull request on this branch. `--state
          # open` matters: a closed or merged one must not be edited in place
          # of opening the draft.
          url="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)"
          if [ -n "$url" ]; then
            gh pr edit "$url" --title "$title" --body-file /tmp/pr-body.md --add-label content:new-year
            echo "operation=updated" >> "$GITHUB_OUTPUT"
          else
            url="$(gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH" \
              --title "$title" \
              --label content:new-year \
              --body-file /tmp/pr-body.md)"
            echo "operation=created" >> "$GITHUB_OUTPUT"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # A pull request opened with GITHUB_TOKEN does not trigger `pull_request`
      # workflows; GitHub parks them behind "Approve and run". `workflow_dispatch`
      # is the documented exception, and its check runs bind to the branch head
      # SHA — the pull request's head SHA — so they appear in its Checks tab.
      # See .github/workflows/new-entry.yml for the long version.
      - name: Run the content checks on the new branch
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN }}
          BRANCH: cohort/${{ steps.year.outputs.value }}
        run: |
          set -euo pipefail
          if [ -n "$BOT_TOKEN" ]; then
            echo "CONTENT_BOT_TOKEN is set, so the pull request triggers its own checks." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Checks dispatched on \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          for workflow in validate.yml quality.yml lint-workflows.yml; do
            if gh workflow run "$workflow" --ref "$BRANCH"; then
              echo "- \`$workflow\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$workflow\` could not be dispatched; approve the parked run from the Actions tab." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Link the pull request from the issue
        if: github.event_name == 'issues' && steps.pr.outputs.url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_OPERATION: ${{ steps.pr.outputs.operation }}
          COHORT_YEAR: ${{ steps.year.outputs.value }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            // An edited issue updates the existing pull request; say that
            // instead of repeating the full first-time comment.
            const created = process.env.PR_OPERATION === 'created';
            await notify.notifyIssue({
              github, context, core,
              kind: created ? 'draft_ready' : 'draft_updated',
              status: notify.STATUS.inReview,
              prUrl: process.env.PR_URL,
              mention: notify.submitter(context),
              vars: {
                details: created
                  ? `The draft sets up cohort ${process.env.COHORT_YEAR} with a placeholder landing page and three placeholder events. Once it is merged, use the **Update a cohort schedule** form to put the real events in.`
                  : 'The diff there now shows the new scaffold.'
              }
            });

      # scaffold_year.rb never overwrites, so a year that is already set up
      # produces no files, no pull request and — until this step — no reply.
      - name: Say the year already exists
        if: github.event_name == 'issues' && steps.scaffold.outputs.created == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COHORT_YEAR: ${{ steps.year.outputs.value }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            const year = process.env.COHORT_YEAR;
            const reason = `Cohort ${year} already exists. Use the **Update a cohort schedule** form to change the events stored for ${year}, or the **Add event details** form to give one of them its own page.`;
            await notify.notifyIssue({ github, context, core, kind: 'no_change', vars: { reason } });

      # Everything above can still leave the issue silent if the push or the
      # pull request itself is refused — most often because "Allow GitHub
      # Actions to create and approve pull requests" was never ticked.
      - name: Say the pull request could not be opened
        if: >-
          failure() && github.event_name == 'issues'
          && steps.year.outcome != 'failure' && steps.scaffold.outcome != 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.notifyIssue({ github, context, core, kind: 'pr_failed' });
