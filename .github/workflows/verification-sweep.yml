name: Verification sweep

# Once a month, find the catalog entries nobody has confirmed inside the window
# in _data/site.yml (`catalog.verify_after_days`) and open ONE refresh issue per
# entry, mentioning the person who submitted it. The site already tells readers
# when an entry is old; this is the other half — asking the people who can say
# whether it is still true.
#
# It is a reminder, not a gate: it never edits an entry and asks for nothing but
# `issues: write`. Confirming an entry is a human answering the refresh form,
# which opens a pull request of its own (refresh-entry.yml).
#
# Each issue carries `<!-- refresh-entry: <slug> -->`, which is how the next run
# finds the same thread instead of opening a second one. An entry that has been
# confirmed since gets its issue closed with a note. New issues per run are
# capped by `catalog.refresh_max_new_issues`; the rest are named in the run
# summary and picked up next month, never dropped in silence.
#
# Turn the schedule off by setting the repository variable VERIFICATION_SWEEP
# to `false` (Settings -> Secrets and variables -> Actions -> Variables), or by
# deleting this file; a manual run from the Actions tab always works. A template
# fork with no entries yet produces no issue either way.

on:
  schedule:
    # 07:00 UTC on the 1st. Early enough to be waiting on the 1st in every US
    # timezone, and off the hour-zero peak where scheduled runs queue for ages.
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions: {}

# A manual run while the monthly one is in flight would otherwise race it and
# could open a second issue for an entry before the first has been searched for.
concurrency:
  group: verification-sweep
  cancel-in-progress: false

jobs:
  # A job whose `if` is false shows up as a bare grey "skipped" with no reason,
  # which reads like a broken workflow rather than a setting somebody chose.
  # This one runs only in that case and says so in the run summary.
  turned-off:
    if: vars.VERIFICATION_SWEEP == 'false' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Say why nothing ran
        run: |
          echo "The verification sweep is turned off by the repository variable VERIFICATION_SWEEP. Turn it back on in Settings -> Secrets and variables -> Actions -> Variables, or run this workflow by hand from the Actions tab." >> "$GITHUB_STEP_SUMMARY"

  sweep:
    if: vars.VERIFICATION_SWEEP != 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # The issue bodies travel through a file, not a step output: an output is
      # re-exported below as one environment entry, which Linux caps near
      # 128 KiB, and two hundred issue bodies can pass that. An env entry that
      # large stops the runner from launching the step that reads it.
      - name: Find unconfirmed entries
        id: sweep
        env:
          SWEEP_ISSUES_FILE: ${{ runner.temp }}/sweep-issues.json
        run: node scripts/verification_sweep.mjs

      # Runs whatever the count is: with nothing stale there may still be issues
      # from last month whose entries have since been confirmed, and those are
      # closed here rather than left to rot with the label on them.
      - name: Open, refresh and close the entry refresh issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SWEEP_ISSUES_FILE: ${{ runner.temp }}/sweep-issues.json
          SWEEP_SLUGS: ${{ steps.sweep.outputs.slugs }}
          SWEEP_COUNT: ${{ steps.sweep.outputs.count }}
          SWEEP_MAX_NEW: ${{ steps.sweep.outputs.max_new }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issuesFile = process.env.SWEEP_ISSUES_FILE;
            const wanted = issuesFile && fs.existsSync(issuesFile)
              ? JSON.parse(fs.readFileSync(issuesFile, 'utf8'))
              : [];
            const staleSlugs = new Set(String(process.env.SWEEP_SLUGS || '').split('\n').filter(Boolean));
            const staleCount = Number(process.env.SWEEP_COUNT || '0');
            const maxNew = Number(process.env.SWEEP_MAX_NEW || '20');

            // The label has to exist before an issue can carry it.
            // bootstrap-labels.yml creates it, but that workflow is a manual
            // one-time step a fork can skip, and this one runs unattended on a
            // schedule — so it makes sure. Creating it here is idempotent, and
            // the colour and description match bootstrap-labels.yml.
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: 'verification',
                color: '8250DF',
                description: 'Entries due to be re-confirmed with their contact',
              });
            } catch (error) {
              if (error.status !== 422) throw error; // 422 = already exists
            }

            // The marker, not the title: titles carry the entry name, entries
            // get renamed, and a title match that misses forks the thread.
            // Written by `issueMarker` in scripts/verification_sweep.mjs.
            const MARKER = /<!--\s*refresh-entry:\s*([a-z0-9-]+)\s*-->/;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'verification',
              per_page: 100,
            });
            const mine = new Map();
            for (const issue of open) {
              if (issue.pull_request) continue;
              const found = MARKER.exec(issue.body || '');
              // No marker: an issue somebody labelled by hand, or the single
              // rolling checklist earlier versions of this sweep kept. Not this
              // job's to rewrite or close.
              if (found) mine.set(found[1], issue);
            }

            let created = 0;
            let refreshed = 0;
            let deferred = staleCount - wanted.length;
            const opened = [];

            for (const item of wanted) {
              const existing = mine.get(item.slug);
              if (existing) {
                if (existing.title !== item.title || existing.body !== item.body) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: existing.number,
                    title: item.title,
                    body: item.body,
                  });
                }
                refreshed += 1;
                continue;
              }
              if (created >= maxNew) {
                deferred += 1;
                continue;
              }
              const { data } = await github.rest.issues.create({
                owner,
                repo,
                title: item.title,
                body: item.body,
                labels: ['verification'],
              });
              created += 1;
              opened.push(`- [#${data.number}](${data.html_url}) — ${item.title}`);
            }

            // Confirmed since the last run: say so on the thread and close it,
            // so the label is a live queue rather than a growing archive.
            let closed = 0;
            for (const [slug, issue] of mine) {
              if (staleSlugs.has(slug)) continue;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: 'This entry has been confirmed since — its last-confirmed date is back inside the window, so there is nothing left to do here. Closing; the sweep will open a fresh issue if it goes unconfirmed again.',
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              closed += 1;
            }

            const summary = core.summary.addHeading('Entry refresh sweep', 3);
            if (staleCount === 0 && closed === 0) {
              summary.addRaw('Every entry has been confirmed inside the window. Nothing to open.');
            } else {
              summary.addList([
                `${staleCount} ${staleCount === 1 ? 'entry is' : 'entries are'} past the window`,
                `${created} issue${created === 1 ? '' : 's'} opened`,
                `${refreshed} existing issue${refreshed === 1 ? '' : 's'} refreshed`,
                `${closed} issue${closed === 1 ? '' : 's'} closed because the entry was confirmed`,
              ]);
              if (opened.length) summary.addRaw(`\n${opened.join('\n')}\n`);
              if (deferred > 0) {
                summary.addRaw(
                  `\n**${deferred} more ${deferred === 1 ? 'entry is' : 'entries are'} waiting.** ` +
                    'One run opens at most `catalog.refresh_max_new_issues` new issues (from ' +
                    '`_data/site.yml`) so a backlog does not arrive as one wall of notifications. ' +
                    'Work through the ones above and run this workflow again from the Actions tab, ' +
                    'or raise that number.\n'
                );
              }
            }
            await summary.write();
            core.notice(`Refresh sweep: ${created} opened, ${refreshed} refreshed, ${closed} closed, ${deferred} deferred.`);

      # A red monthly run with nothing but a stack trace in it tells a
      # non-coder maintainer nothing. Whatever failed, this says what it means.
      - name: Explain a failed run
        if: failure()
        run: |
          {
            echo "### Could not check which entries need re-confirming"
            echo
            echo "This is usually a temporary GitHub problem. Nothing on the site changed and no entry was edited."
            echo
            echo "The next monthly run will try again, or run this workflow now from the Actions tab."
          } >> "$GITHUB_STEP_SUMMARY"
