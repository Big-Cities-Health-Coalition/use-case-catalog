name: Lint workflows

# Every workflow in this directory: expression-heavy `if:` conditions, minimal
# `permissions` blocks and a documented rule that untrusted issue text only ever
# reaches a step through `env:` — all of it enforced by review alone until now.
# (No count here on purpose: this line said "eleven" for two workflows longer
# than it was true.)
#
#   actionlint  parses every workflow, type-checks the expressions, and runs
#               shellcheck over each `run:` script.
#   zizmor      audits them for Actions-specific security problems: template
#               injection sinks, over-broad permissions, credential persistence.
#               That is exactly the property SECURITY.md promises.
#
# Both are pinned. A finding that is deliberate is suppressed at the line it
# concerns (`# zizmor: ignore[rule]`, `# shellcheck disable=SCxxxx`) with a
# comment saying why, so the reason travels with the code.

on:
  # This check is a required status on protected branches. Run it for every
  # pull request so content-only changes cannot be left waiting for a
  # path-filtered status that GitHub never creates.
  pull_request:
  workflow_dispatch:

permissions: {}

# A content-only pull request (a submission; see content-only.yml) changes no
# workflow, so `lint` is skipped there; skipped by `if:`, it reports as passed.
jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/content-only.yml

  lint:
    needs: changes
    # Skipped (reported as passed) on a content-only change; see
    # content-only.yml. `!cancelled()` keeps a failed classification from
    # skipping it.
    if: ${{ !cancelled() && needs.changes.outputs.content_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Run zizmor
        # `medium` is the level at which the findings are still actionable;
        # anything deliberate carries an inline `# zizmor: ignore[...]`.
        run: pipx run zizmor==1.29.0 --min-severity medium .github/workflows/

  status:
    # A workflow_dispatch run has no pull-request payload, so its `lint` check
    # is not attached to the generated PR. Publish the same canonical context
    # on the dispatched branch head so protected-main requirements can resolve.
    name: Report the dispatched run on its commit
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [changes, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Post the canonical lint status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const contentOnly = ${{ toJSON(needs.changes.outputs.content_only) }} === 'true';
            const result = ${{ toJSON(needs.lint.result) }};
            const skipped = contentOnly && result === 'skipped';
            const passed = result === 'success' || skipped;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'lint',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: skipped
                ? 'Skipped: content-only change'
                : passed
                  ? 'Workflow lint passed'
                  : 'Workflow lint reported problems',
            });
