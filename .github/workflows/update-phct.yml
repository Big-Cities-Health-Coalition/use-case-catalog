name: Update from PHCT

# Manual-only during the release-readiness period. A weekly schedule is added
# only after the first release-candidate update and rollback have both been
# rehearsed successfully. Every run targets one immutable tag.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact PHCT release tag, e.g. v1.9.0 — copy it from https://github.com/crypticpy/phct/releases
        required: true
        type: string

permissions: {}

concurrency:
  group: update-phct
  cancel-in-progress: false

jobs:
  update:
    name: Open protected PHCT update
    # This workflow is distributed by PHCT for downstream deployments. It is
    # intentionally inert in the canonical template repository itself.
    if: github.repository != 'crypticpy/phct'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      parent_commit: ${{ steps.release.outputs.commit }}
      from: ${{ steps.release.outputs.from }}
      from_commit: ${{ steps.release.outputs.from_commit }}
      lock_state: ${{ steps.release.outputs.lock_state }}
      branch: ${{ steps.release.outputs.branch }}
      candidate_commit: ${{ steps.candidate.outputs.commit }}
      publication_digest: ${{ steps.publication.outputs.artifact-digest }}

    steps:
      - name: Checkout downstream repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A workflow_dispatch run can be started while viewing any branch.
          # Template updates always branch from the repository's default branch.
          ref: ${{ github.event.repository.default_branch }}
          # Candidate code runs before publication. Keep the workflow-capable
          # credential out of checkout and out of every candidate build step.
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact current npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci

      - name: Validate the current ownership boundary
        run: npm run ownership:check

      - name: Snapshot protected deployment files
        run: npm run ownership:snapshot -- "$RUNNER_TEMP/deployment-protected-before.json"

      - name: Fetch and resolve the exact PHCT tag
        id: release
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          releases_url=https://github.com/crypticpy/phct/releases
          issues_url=https://github.com/crypticpy/phct/issues
          # A whole-string match, not line-based grep: a multi-line value whose
          # first line looks like a tag must not slip past into the release=
          # output write below.
          tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$RELEASE" =~ $tag_pattern ]]; then
            echo "Release must be an exact semantic-version tag such as v1.9.0 or v1.9.0-rc.1." >&2
            # Echo the rejected input back safely: anything outside this set,
            # including a newline that could forge a workflow command, becomes ?.
            safe_release="$(printf '%s' "$RELEASE" | tr -c 'A-Za-z0-9.+_-' '?' | cut -c1-60)"
            echo "::error title=That is not a PHCT release tag::Enter an exact tag such as v1.9.0 or v1.9.0-rc.1, copied from $releases_url."
            {
              echo "## That is not a PHCT release tag"
              echo
              echo "Nothing was changed. No branch and no pull request were created."
              echo
              echo "You entered \`$safe_release\`. A release tag is an exact version: a lowercase \`v\`, three numbers separated by dots, and nothing else — for example \`v1.9.0\` or \`v1.9.0-rc.1\`."
              echo
              echo "Open $releases_url, copy the tag exactly as it is written beside the release you want, and run **Update from PHCT** again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          git remote add phct https://github.com/crypticpy/phct.git
          if [ -f .phct-version.json ]; then
            from="$(node --input-type=module -e "import lock from './.phct-version.json' with { type: 'json' }; process.stdout.write(lock.release)")"
            locked_commit="$(node --input-type=module -e "import lock from './.phct-version.json' with { type: 'json' }; process.stdout.write(lock.commit)")"
            lock_state=verified
          else
            from="$(node -p "'v' + require('./package.json').version")"
            locked_commit=""
            lock_state=bootstrapped
          fi
          from_ref="refs/phct-update/from/$from"
          tag_ref="refs/phct-update/to/$RELEASE"
          # Fetched one refspec at a time so a missing tag names itself. Both
          # refs are still the same immutable tags, fetched from the same remote.
          if ! git fetch --force --no-tags phct "refs/tags/$from:$from_ref"; then
            if [ "$lock_state" = "bootstrapped" ]; then
              echo "::error title=This copy reports a template version that has no release::Version $from is not published at $releases_url."
              {
                echo "## This copy reports a template version that has no release"
                echo
                echo "Nothing was changed. No branch and no pull request were created."
                echo
                echo "This copy reports template version \`$from\`, but no such release exists. This usually means the copy was created between releases, from template code that had not been published yet."
                echo
                echo "What to do:"
                echo
                echo "1. Open $releases_url."
                echo "2. If \`$from\` is listed there now, simply run **Update from PHCT** again — it will work this time."
                echo "3. If the newest release listed is older than \`$from\`, this deployment cannot update itself yet, because the updater has no published starting point to compare against. Wait until \`$from\` is released, or report it to the template maintainers at $issues_url with a link to this run and the version \`$from\`."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=The recorded starting release is missing::$from is recorded in .phct-version.json but is no longer published at $releases_url."
              {
                echo "## The release this deployment records has disappeared"
                echo
                echo "Nothing was changed. No branch and no pull request were created."
                echo
                echo "This deployment's \`.phct-version.json\` says it runs \`$from\`, but the template repository no longer has a release with that tag. A published release is never supposed to disappear, so the updater stops instead of guessing."
                echo
                echo "What to do: report this to the template maintainers at $issues_url with a link to this run and the release name \`$from\`. Your site is unaffected in the meantime."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 2
          fi
          if ! git fetch --force --no-tags phct "refs/tags/$RELEASE:$tag_ref"; then
            # Only a tag Git actually resolved is ever echoed verbatim.
            safe_release="$(printf '%s' "$RELEASE" | tr -c 'A-Za-z0-9.+_-' '?' | cut -c1-60)"
            echo "::error title=No PHCT release named $safe_release::Copy an exact tag from $releases_url and run the update again."
            {
              echo "## There is no PHCT release named \`$safe_release\`"
              echo
              echo "Nothing was changed. No branch and no pull request were created."
              echo
              echo "The template repository has no release tagged \`$safe_release\`. The tag may be misspelled, or it may not be published yet."
              echo
              echo "Open $releases_url, copy the tag exactly as it is written beside the release you want, and run **Update from PHCT** again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          resolved_from="$(git rev-parse "$from_ref^{commit}")"
          if [ -n "$locked_commit" ] && [ "$resolved_from" != "$locked_commit" ]; then
            echo "Locked PHCT commit $locked_commit does not match $from at $resolved_from." >&2
            echo "Refusing an update from a moved tag or inconsistent lock file." >&2
            echo "::error title=The recorded template release no longer matches::Refusing an update from a moved tag or inconsistent lock file."
            {
              echo "## The update was refused for safety"
              echo
              echo "Nothing was changed. No branch and no pull request were created."
              echo
              echo "This deployment's \`.phct-version.json\` records that it runs \`$from\` at commit \`$locked_commit\`, but \`$from\` in the template repository now points at commit \`$resolved_from\`."
              echo
              echo "A published release tag is never supposed to move, so the updater stops rather than guess which of those two versions this deployment is really running."
              echo
              echo "What to do: report this to the template maintainers at $issues_url with a link to this run, the release name \`$from\`, and both commits above. Do not merge any template update until they confirm which commit is correct. Your site is unaffected in the meantime."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          if [ "$lock_state" = "bootstrapped" ]; then
            echo "::notice::No .phct-version.json exists; bootstrapping the first update from package.json $from at $resolved_from. Review that baseline commit in the update pull request."
          fi
          commit="$(git rev-parse "$tag_ref^{commit}")"
          {
            printf 'release=%s\n' "$RELEASE"
            printf 'tag_ref=%s\n' "$tag_ref"
            printf 'commit=%s\n' "$commit"
            printf 'from=%s\n' "$from"
            printf 'from_commit=%s\n' "$resolved_from"
            printf 'from_ref=%s\n' "$from_ref"
            printf 'lock_state=%s\n' "$lock_state"
            printf 'branch=upgrade/phct-%s\n' "$RELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Preview incoming ownership classification
        env:
          FROM_REF: ${{ steps.release.outputs.from_ref }}
          TAG_REF: ${{ steps.release.outputs.tag_ref }}
        run: node scripts/upgrade_check.mjs --from "$FROM_REF" --to "$TAG_REF"

      - name: Apply the immutable PHCT candidate
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          FROM_REF: ${{ steps.release.outputs.from_ref }}
          TAG_REF: ${{ steps.release.outputs.tag_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          node scripts/apply_phct_update.mjs --from "$FROM_REF" --to "$TAG_REF"

      - name: Prove deployment files survived the update byte-for-byte
        run: npm run ownership:verify -- "$RUNNER_TEMP/deployment-protected-before.json"

      - name: Require a workflow-capable token when workflows change
        env:
          UPDATE_TOKEN_CONFIGURED: ${{ secrets.PHCT_UPDATE_TOKEN != '' }}
        run: |
          set -euo pipefail
          workflow_changes="$(git status --porcelain --untracked-files=all -- .github/workflows)"
          if [ -z "$workflow_changes" ]; then
            echo "This release does not change downstream workflow files." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$UPDATE_TOKEN_CONFIGURED" = "true" ]; then
            echo "PHCT_UPDATE_TOKEN is configured for the workflow-file update." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error title=PHCT_UPDATE_TOKEN required::This release changes .github/workflows, which GitHub's built-in Actions token cannot push. Configure the dedicated repository secret before rerunning the update."
          {
            echo "## PHCT update credential required"
            echo
            echo "This release changes \`.github/workflows\`. GitHub's built-in Actions token cannot push that path, so no branch or pull request was created."
            echo
            echo "Configure the repository-scoped \`PHCT_UPDATE_TOKEN\` described in https://github.com/crypticpy/phct/blob/main/docs/upgrading.md#workflow-token-required-for-workflow-updates and rerun this exact release."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 2

      # The parent release may change either runtime pin. Node at the start of
      # the job belongs to the currently consumed downstream version and only
      # runs the bootstrap checks; select both candidate versions after reconciling the parent tree.
      - name: Setup candidate Ruby from the applied .ruby-version
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true

      - name: Setup candidate Node from the applied .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact candidate npm
        run: node scripts/install_exact_npm.mjs

      - name: Install the candidate npm dependencies
        run: npm ci

      - name: Regenerate downstream outputs with the new PHCT generator
        run: npm run generate

      - name: Record the consumed release and commit
        env:
          RELEASE: ${{ steps.release.outputs.release }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: npm run version:record -- --release "$RELEASE" --commit "$COMMIT"

      - name: Recheck ownership after regeneration
        run: |
          npm run ownership:verify -- "$RUNNER_TEMP/deployment-protected-before.json"
          npm run ownership:check
          npm run ownership:snapshot -- "$RUNNER_TEMP/deployment-protected-after.json"

      - name: Run every non-browser release gate
        run: |
          set -euo pipefail
          if npm run verify; then
            exit 0
          fi
          echo "::error title=The update failed this deployment's own tests::Nothing was published. The failing output is in this step's log."
          {
            echo "## The update failed this deployment's own tests"
            echo
            echo "The update's full test suite failed on the candidate. Nothing was published: no branch, no pull request, and your live site is untouched."
            echo
            echo "This usually means the new release is incompatible with this deployment — report it to the template maintainers at https://github.com/crypticpy/phct/issues with a link to this run."
            echo
            echo "The failure itself is in the **Run every non-browser release gate** step of the log on this page."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Commit the verified candidate and create its publication bundle
        id: candidate
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE: ${{ steps.release.outputs.release }}
          PARENT_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            # A benign no-op, not a failure: re-running the updater on a
            # release this deployment already consumes must finish green.
            echo "::notice title=Already up to date::This deployment already runs $RELEASE ($PARENT_COMMIT). Nothing to do."
            {
              echo "## Already up to date"
              echo
              echo "Already up to date — this deployment already runs \`$RELEASE\`. Nothing to do."
              echo
              echo "The updater compared this deployment against \`$RELEASE\` (commit \`$PARENT_COMMIT\`) and found no difference in any template-owned file, so it created no branch and no pull request. Nothing needed changing and nothing was changed."
              echo
              echo "This run succeeded. To take a newer release, run **Update from PHCT** again with a later tag from https://github.com/crypticpy/phct/releases."
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'up_to_date=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit --no-verify -m "chore: update PHCT to $RELEASE"
          candidate_commit="$(git rev-parse HEAD)"
          git bundle create "$RUNNER_TEMP/phct-update.bundle" "refs/heads/$BRANCH"
          git bundle verify "$RUNNER_TEMP/phct-update.bundle"
          printf 'commit=%s\n' "$candidate_commit" >> "$GITHUB_OUTPUT"

      - name: Save the inspectable site and ownership evidence
        if: steps.candidate.outputs.up_to_date != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phct-update-${{ steps.release.outputs.release }}
          path: |
            _site/
            ${{ runner.temp }}/deployment-protected-before.json
            ${{ runner.temp }}/deployment-protected-after.json
          if-no-files-found: error
          retention-days: 14

      - name: Transfer the verified commit to an isolated publication job
        id: publication
        if: steps.candidate.outputs.up_to_date != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phct-publication-${{ steps.release.outputs.release }}
          path: ${{ runner.temp }}/phct-update.bundle
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified PHCT update
    needs: update
    # An "already up to date" run succeeds without producing a candidate
    # commit. There is nothing to publish, so this job is skipped rather than
    # failed. Every other outcome of the update job still gates publication.
    if: needs.update.result == 'success' && needs.update.outputs.candidate_commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout the trusted downstream base on a fresh runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Download the verified publication bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phct-publication-${{ needs.update.outputs.release }}
          path: ${{ runner.temp }}/phct-publication
          digest-mismatch: error

      - name: Verify the exact bundled candidate without checking it out
        env:
          BRANCH: ${{ needs.update.outputs.branch }}
          EXPECTED_COMMIT: ${{ needs.update.outputs.candidate_commit }}
          BUNDLE: ${{ runner.temp }}/phct-publication/phct-update.bundle
        run: |
          set -euo pipefail
          git bundle verify "$BUNDLE"
          git fetch --no-tags "$BUNDLE" "refs/heads/$BRANCH:refs/phct-publish/candidate"
          actual="$(git rev-parse 'refs/phct-publish/candidate^{commit}')"
          if [ "$actual" != "$EXPECTED_COMMIT" ]; then
            echo "Publication bundle resolved to $actual, expected verified candidate $EXPECTED_COMMIT." >&2
            exit 2
          fi

      - name: Push the verified commit from the clean runner
        env:
          PUSH_TOKEN: ${{ secrets.PHCT_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.update.outputs.branch }}
          CANDIDATE_COMMIT: ${{ needs.update.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/phct-git-askpass.sh"
          # These variables must be evaluated later by askpass, not while the
          # helper is being created.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$PUSH_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -c core.hooksPath=/dev/null -c credential.helper= \
            push --force-with-lease origin "$CANDIDATE_COMMIT:refs/heads/$BRANCH"

      - name: Open or update the human-reviewed pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.PHCT_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.update.outputs.branch }}
          RELEASE: ${{ needs.update.outputs.release }}
          COMMIT: ${{ needs.update.outputs.parent_commit }}
          CANDIDATE_COMMIT: ${{ needs.update.outputs.candidate_commit }}
          PUBLICATION_DIGEST: ${{ needs.update.outputs.publication_digest }}
          FROM: ${{ needs.update.outputs.from }}
          FROM_COMMIT: ${{ needs.update.outputs.from_commit }}
          LOCK_STATE: ${{ needs.update.outputs.lock_state }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Backticks below are intentional Markdown, not shell substitutions.
          # shellcheck disable=SC2016
          {
            printf 'Updates this deployment from PHCT `%s` to [`%s`](https://github.com/crypticpy/phct/releases/tag/%s).\n\n' "$FROM" "$RELEASE" "$RELEASE"
            printf 'The workflow run that produced it, with the downloadable site preview: %s\n\n' "$run_url"
            printf 'Previous parent commit: `%s`\n' "$FROM_COMMIT"
            printf 'Exact parent commit: `%s`\n' "$COMMIT"
            printf 'Verified downstream commit: `%s`\n' "$CANDIDATE_COMMIT"
            printf 'Publication bundle digest: `%s`\n\n' "$PUBLICATION_DIGEST"
            if [ "$LOCK_STATE" = "bootstrapped" ]; then
              printf '> [!IMPORTANT]\n> This is the first update that records which template release this deployment runs. Nothing was recorded before, so the workflow worked out from `package.json` that you were on `%s`. Check that before approving: open https://github.com/crypticpy/phct/releases, find `%s`, and check the commit shown beside the tag starts with `%.7s`.\n\n' "$FROM" "$FROM" "$FROM_COMMIT"
            else
              printf 'The previous parent commit matched the existing `.phct-version.json` lock.\n\n'
            fi
            printf '### Automated evidence\n\n'
            printf -- '- [x] Before/after checksum manifests prove every protected deployment file is byte-identical\n'
            printf -- '- [x] The complete template-owned tree matches the target without assuming shared Git ancestry\n'
            printf -- '- [x] Generated outputs were rebuilt from deployment configuration\n'
            printf -- '- [x] The PHCT ownership manifest and version lock agree\n'
            printf -- '- [x] `npm run verify` passed on the update commit\n'
            printf -- '- [x] The verified commit crossed into a clean publication runner through a digest-checked Git bundle\n'
            printf -- '- [x] An inspectable `_site` artifact is attached to the workflow run\n\n'
            printf '### Before you merge this\n\n'
            printf -- '- [ ] Read the release notes: https://github.com/crypticpy/phct/releases/tag/%s\n' "$RELEASE"
            printf -- '- [ ] Every check in the Checks box on this pull request shows a green tick\n'
            printf -- '- [ ] Download the site preview (the `phct-update-%s` artifact) from the workflow run page linked above (%s), unzip it, open `index.html`, and confirm the site still looks like yours — name, banner, policy, content, and images\n' "$RELEASE" "$run_url"
            printf -- '- [ ] Look through the Files changed tab, including the regenerated files\n'
          } > "$RUNNER_TEMP/phct-pr-body.md"

          open_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --title "Update PHCT to $RELEASE" --body-file "$RUNNER_TEMP/phct-pr-body.md"
            pr_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$open_pr"
          else
            pr_url="$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --title "Update PHCT to $RELEASE" --body-file "$RUNNER_TEMP/phct-pr-body.md")"
          fi
          printf 'url=%s\n' "$pr_url" >> "$GITHUB_OUTPUT"

      - name: Dispatch checks when the built-in token opened the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TOKEN_CONFIGURED: ${{ secrets.PHCT_UPDATE_TOKEN != '' }}
          BRANCH: ${{ needs.update.outputs.branch }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: |
          set -euo pipefail
          if [ "$UPDATE_TOKEN_CONFIGURED" = "true" ]; then
            echo "PHCT_UPDATE_TOKEN triggered pull-request checks normally." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # These two entrypoints exist in every supported downstream release.
          # The candidate validate.yml fans out to its Performance, Supply
          # chain, and CodeQL reusable workflows on the selected branch.
          dispatched_workflows=""
          failed_workflows=""
          for workflow in validate.yml quality.yml; do
            dispatched=false
            error_log="$RUNNER_TEMP/phct-dispatch-${workflow%.yml}.log"
            for attempt in 1 2 3; do
              : > "$error_log"
              if timeout --signal=TERM 45s gh workflow run "$workflow" --ref "$BRANCH" 2> "$error_log"; then
                dispatched=true
                dispatched_workflows="${dispatched_workflows}${dispatched_workflows:+, }$workflow"
                break
              else
                status=$?
              fi

              if [ "$status" -eq 124 ]; then
                reason="timed out after 45 seconds"
              else
                reason="GitHub CLI exited with status $status"
              fi
              echo "::warning title=Check dispatch attempt failed::$workflow attempt $attempt of 3 $reason."
              tail -n 5 "$error_log" >&2 || true
              if [ "$attempt" -lt 3 ]; then
                sleep "$((attempt * 5))"
              fi
            done

            if [ "$dispatched" != "true" ]; then
              failed_workflows="${failed_workflows}${failed_workflows:+, }$workflow"
            fi
          done

          if [ -n "$failed_workflows" ]; then
            {
              echo "### Required update checks need attention"
              echo
              echo "The verified update pull request already exists: $PR_URL"
              echo
              echo "**Main is unchanged. Do not merge the pull request until every required check is green.**"
              echo
              echo "GitHub did not accept these workflow dispatches after three attempts: \`$failed_workflows\`."
              if [ -n "$dispatched_workflows" ]; then
                echo "These dispatches succeeded: \`$dispatched_workflows\`."
              fi
              echo
              echo "To recover without code changes:"
              echo "1. Open **Actions → Validate Content → Run workflow**, select \`$BRANCH\`, and run it if \`validate.yml\` is listed above."
              echo "2. Open **Actions → Quality (a11y + Lighthouse) → Run workflow**, select \`$BRANCH\`, and run it if \`quality.yml\` is listed above."
              echo "3. Wait for Validate Content, Performance, Supply chain, CodeQL, and Quality to finish, then review the pull request normally."
              echo
              echo "If GitHub reports an API outage or rate limit, wait for service to recover and rerun this updater; it safely updates the same branch and pull request."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Required update checks were not dispatched::The update pull request exists and main is unchanged. Do not merge it; follow the recovery steps in this run summary."
            exit 1
          fi

          echo "Validate Content (including Performance, Supply chain, and CodeQL) and Quality were dispatched on \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
