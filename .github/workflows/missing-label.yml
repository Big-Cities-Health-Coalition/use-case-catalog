name: Missing content label

# Every issue a person outside the project opens gets an answer, and no
# submission goes silent.
#
# Every content workflow is triggered by a `content:*` label, and an issue form
# applies a label only if that label already exists. In a fresh fork nobody has
# run Bootstrap labels yet, so GitHub drops the label silently: the form is
# filled in, the issue opens, no workflow matches it, and nothing (no comment,
# no failed run, no red X) ever says why. The submitter waits. The same happens
# when GitHub rejects an issue form as invalid: its links then open a plain
# blank issue, and the submission arrives as free text with no label at all.
#
# So, for an issue with no `content:*` label:
#   * one that plainly came from a content form gets the "label missing"
#     message, for whoever opened it;
#   * any other issue from someone outside the project (not an owner, member
#     or collaborator) gets a short acknowledgement with its number and the
#     `needs-triage` label, so a maintainer finds it and the person knows it
#     arrived.
# Outside submissions also get `status:received`, which the /status/ page
# reads. The wording lives in scripts/lib/notify.mjs.
#
# It reads the title, the body's shape and the label list, comments at most
# once, and never writes to the repository.

on:
  issues:
    types:
      - opened

permissions: {}

jobs:
  explain:
    # `join()` flattens the label names so one `contains` covers every
    # `content:*` label without listing them.
    if: "!contains(join(github.event.issue.labels.*.name, ','), 'content:')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      # The default branch, for the message module and the site's wording.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Acknowledge the issue, or say the label is missing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            const title = String(process.env.ISSUE_TITLE || '');
            const outsider = !['OWNER', 'MEMBER', 'COLLABORATOR'].includes(process.env.AUTHOR_ASSOCIATION);
            // An issue-form submission renders each question as an `### `
            // heading. A hand-written issue does not, however form-like its
            // title looks.
            const formShapedBody = /^### /mu.test(String(process.env.ISSUE_BODY || ''));

            // The other forms (bug, docs, feature, accessibility) also carry a
            // label, but nothing is automated from them: a maintainer reads the
            // issue either way. Only the content forms go silent, so only they
            // are matched here. The site-problem form carries no label at all
            // and falls through to the acknowledgement below, like any other
            // outside issue.
            const OTHER_FORMS = ['[Bug]', '[Docs]', '[Feature]', '[Accessibility]'];

            // Ordered: "Event attachments:" has to be tried before "Event:".
            const FORMS = [
              { name: 'Apply setup', label: 'content:site-config', match: (t) => t.startsWith('[Setup]') },
              {
                name: 'Update event attachments',
                label: 'content:event-attachments',
                match: (t) => t.startsWith('Event attachments:'),
              },
              { name: 'Add event details', label: 'content:new-event', match: (t) => t.startsWith('Event:') },
              { name: 'Start a new cohort year', label: 'content:new-year', match: (t) => t.startsWith('[Cohort]') },
              { name: 'Update a cohort schedule', label: 'content:schedule', match: (t) => t.startsWith('Schedule:') },
              { name: 'Refresh an entry', label: 'content:refresh', match: (t) => t.startsWith('Refresh:') },
              // "Edit:" is a common start for a hand-written issue too, so the
              // edit form also needs its form-shaped body.
              {
                name: 'Suggest an edit',
                label: 'content:edit-request',
                match: (t) => formShapedBody && t.startsWith('Edit:'),
              },
              {
                name: 'Also deployed by',
                label: 'content:also-deployed-by',
                match: (t) => t.startsWith('Also deployed by:'),
              },
              // The entry form's prefix is the singular noun the site was
              // configured with ("[Use case] ", "[Resource] ", "[Project] "),
              // so it is matched by shape, minus the prefixes above and the
              // four non-content forms. A bracketed title alone is not enough:
              // a hand-written "[RFC] …" or "[Question] …" must stay unmatched,
              // so this rule also demands a form-shaped body.
              {
                name: 'New entry',
                label: 'content:new-entry',
                match: (t) =>
                  formShapedBody && /^\[[^\]]+\]\s/.test(t) && !OTHER_FORMS.some((prefix) => t.startsWith(prefix)),
              },
            ];

            const form = FORMS.find((candidate) => candidate.match(title));
            if (form) {
              await notify.notifyIssue({
                github, context, core,
                kind: 'label_missing',
                once: true,
                status: outsider ? notify.STATUS.received : '',
                vars: { form_name: form.name, form_label: form.label }
              });
              if (outsider) await notify.addTriageLabel({ github, context, core });
              return;
            }
            if (!outsider) {
              core.info(`"${title}" was opened by a maintainer and is not a content submission; saying nothing.`);
              return;
            }
            // No form claimed it, so it is not a tracked submission: no status
            // label and no status-page link (the page only knows issues with a
            // content:* label). A maintainer who relabels it starts the flow.
            await notify.notifyIssue({
              github, context, core,
              kind: 'triage_ack',
              once: true,
              status: '',
              vars: { status_url: '' }
            });
            await notify.addTriageLabel({ github, context, core });
