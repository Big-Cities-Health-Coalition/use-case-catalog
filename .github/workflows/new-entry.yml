name: New entry from issue

# A submission arrives as an issue labelled `content:new-entry` (from /submit/ or
# the issue form). This scaffolds catalog/<slug>/index.md plus any screenshots
# the submitter attached, and opens a pull request that closes the issue.
#
# Trust model (see SECURITY.md): anyone can open the issue that starts this job,
# so the job is written to be safe with hostile input rather than to keep hostile
# input out.
#   * Issue content is NEVER interpolated into a `run:` script — it only ever
#     reaches a step through `env:`, so a title containing shell syntax is inert.
#   * The scaffolder refuses to write outside `catalog/<slug>/`, and the slug is
#     re-checked against `^[a-z0-9]+(?:-[a-z0-9]+)*$` before any path is built.
#   * The result is a pull request. Nothing reaches the site without a
#     maintainer merging it.
#
# Set the repository variable SUBMISSIONS_OPEN to `false` to accept submissions
# only from members and collaborators; leaving it unset keeps submissions open.
#
# Optional secret CONTENT_BOT_TOKEN (a fine-grained PAT or GitHub App token with
# contents + pull-requests write): when it is set the pull request is authored by
# a real actor, so `pull_request` workflows trigger natively. Without it the job
# dispatches them itself — see the "Run the content checks" step and
# docs/admin-guide.md § One-time repository setup.
#
# Every reply to the submitter is built by scripts/lib/notify.mjs (wording a
# site can override under `notifications:` in _data/site.yml) and keeps one
# `status:*` label on the issue: received when it opens, in-review once the
# draft exists. submission-status.yml moves it on from there. An edit to the
# issue never opens a second draft (see "Find the draft already open") and
# never rebuilds a draft a reviewer has committed to (see "Check the draft
# branch").

on:
  issues:
    types:
      - opened
      - edited

# The job below declares exactly the scopes it needs; nothing is granted by default.
permissions: {}

# One run per issue: editing an issue three times in a minute must not leave
# three jobs force-pushing the same branch at each other.
concurrency:
  group: new-entry-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  scaffold:
    # `state == 'open'` matters: editing a closed, already-merged submission —
    # to fix a typo, to add a note — would otherwise force-push its branch again
    # and try to edit a merged pull request.
    if: >-
      github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'content:new-entry')
      && (vars.SUBMISSIONS_OPEN != 'false'
          || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Dispatching validate.yml/quality.yml onto the generated branch.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The push below needs credentials; the checkout keeps them on purpose.
          # zizmor: ignore[artipacked]
          token: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Mark the submission received
        if: github.event.action == 'opened'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.notifyIssue({ github, context, core, status: notify.STATUS.received });

      - name: Scaffold entry files
        id: scaffold
        continue-on-error: true
        run: node scripts/new_entry_from_issue.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Lets the scaffolder download images attached to a private issue.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report the failure on the issue
        if: steps.scaffold.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCAFFOLD_ERROR: ${{ steps.scaffold.outputs.error }}
        with:
          script: |
            const detail = process.env.SCAFFOLD_ERROR || 'The scaffolding step failed; see the workflow logs for details.';
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.notifyIssue({ github, context, core, kind: 'scaffold_failed', vars: { reason: detail } });
            core.setFailed(detail);

      # The scaffolder saves whatever the submitter attached, at whatever size
      # their screen produced. This writes the AVIF/WebP width variants beside
      # each one and records them in _data/derivatives.json, so the pull request
      # carries the images the site will actually serve. Never fatal: without
      # derivatives _includes/picture.html emits the plain <img> it always did,
      # and a broken encoder must not cost a submitter their pull request.
      - name: Build responsive image derivatives
        if: steps.scaffold.outcome == 'success'
        continue-on-error: true
        run: node scripts/derive_images.mjs

      # The scaffolder names the branch entry/<slug>-<issue>, and the slug comes
      # from the title, so an edited title proposes a new name. One issue keeps
      # one draft: when a draft for this issue is already open, its branch is
      # the one rebuilt (or held, below), whatever the new name would be. The
      # rebuild starts from the default branch, so the entry folder follows the
      # current title (or "### Slug" answer) as it always has, and the old
      # folder does not linger. See scripts/lib/drafts.mjs.
      - name: Find the draft already open for this issue
        id: draft
        if: steps.scaffold.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROPOSED: ${{ steps.scaffold.outputs.branch }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const drafts = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/drafts.mjs`).href);
            const { branch } = await drafts.findDraftBranch({
              github, context, core,
              proposed: process.env.PROPOSED,
              label: 'content:new-entry',
              prefix: 'entry/',
              numbered: true
            });
            core.setOutput('branch', branch);

      # An edit to the issue re-runs this job, which rebuilds the branch from
      # the default branch and force-pushes it. Once a reviewer has committed to
      # the draft (or pressed "Update branch") that would erase their work, so
      # the branch is only rebuilt while every commit on it is the automation's.
      # Reads the refs `fetch-depth: 0` already fetched; see scripts/branch_guard.mjs.
      - name: Check the draft branch is still the automation's
        id: guard
        if: steps.scaffold.outcome == 'success'
        env:
          BRANCH: ${{ steps.draft.outputs.branch }}
        run: node scripts/branch_guard.mjs

      # The branch is the reviewer's now: tell them what the submitter changed,
      # field by field, and tell the submitter their edit reached the reviewer.
      - name: Hand the edit to the reviewer
        if: steps.guard.outputs.held == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH: ${{ steps.draft.outputs.branch }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.holdEdit({ github, context, core, branch: process.env.BRANCH, schema: true });

      - name: Commit the entry on a new branch
        id: commit
        if: steps.scaffold.outcome == 'success' && steps.guard.outputs.held != 'true'
        env:
          BRANCH: ${{ steps.draft.outputs.branch }}
          SLUG: ${{ steps.scaffold.outputs.slug }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # `git add -A` is safe only because this step is gated on the
          # scaffolder having succeeded: it writes screenshots one at a time, so
          # a half-finished run would otherwise be committed as if it were whole.
          git add -A
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "The scaffolder produced no changes." >&2
            exit 0
          fi
          git commit -m "feat: add entry $SLUG"
          # The branch is machine-generated and named after this issue, so an
          # `issues: edited` re-run replaces its contents rather than merging.
          # The lease is the remote-tracking ref the guard step just read: a
          # reviewer push since then makes this fail instead of being lost.
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        id: pr
        if: steps.commit.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.draft.outputs.branch }}
          ENTRY_DIR: ${{ steps.scaffold.outputs.entry_dir }}
          ENTRY_TITLE: ${{ steps.scaffold.outputs.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IMAGES: ${{ steps.scaffold.outputs.images }}
          WARNINGS: ${{ steps.scaffold.outputs.warnings }}
          PREVIEW: ${{ steps.scaffold.outputs.preview }}
          CHECKLIST: ${{ steps.scaffold.outputs.checklist }}
        run: |
          set -euo pipefail
          # Everything between the braces is literal markdown; a backtick here is
          # a code span, not a command substitution.
          # shellcheck disable=SC2016
          {
            printf 'Scaffolded from issue #%s.\n\n' "$ISSUE_NUMBER"
            printf 'Closes #%s\n\n' "$ISSUE_NUMBER"
            # The entry as a reader will meet it, so review is about the page and
            # not about a YAML diff. Field selection comes from _data/schema.yml.
            if [ -n "$PREVIEW" ]; then
              printf '### The entry\n\n%s\n\n' "$PREVIEW"
            fi
            if [ -n "$IMAGES" ]; then
              printf '### Screenshots downloaded\n\n%s\n\n' "$IMAGES"
            else
              printf '### Screenshots downloaded\n\nNone.\n\n'
            fi
            if [ -n "$WARNINGS" ]; then
              printf '### Warnings from the scaffolder\n\n%s\n\n' "$WARNINGS"
            fi
            # The closer-review block (answers the schema flags with
            # `escalate_on`) and the maintainer checklist — the review criteria
            # from _data/governance.yml when the site publishes them, then the
            # mechanics and the review-status flip. Built by scripts/lib/review.mjs
            # so the pull request and the governance page carry the same list.
            if [ -n "$CHECKLIST" ]; then
              printf '%s\n' "$CHECKLIST"
            else
              printf '### Maintainer checklist\n\n'
              printf -- '- [ ] Front matter values match the schema options and nothing is missing\n'
              printf -- '- [ ] Any PDF or extra file is uploaded into `%s/`\n' "$ENTRY_DIR"
              printf -- '- [ ] **Validate Content** is green on the *latest* commit\n'
              printf -- '- [ ] Merge to publish\n'
            fi
          } > /tmp/pr-body.md

          # An `issues: edited` re-run reuses the pull request that already
          # points at this branch instead of failing.
          # The label is safe to pass unconditionally: this job only runs for an
          # issue that already carries `content:new-entry`, so the label exists.
          # It is what makes generated submissions filterable in the pull
          # request list, where nothing else distinguishes them. `--state open`
          # matters: a closed pull request for this branch must not be edited
          # in place of opening the draft (see refresh-entry.yml).
          url="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)"
          if [ -n "$url" ]; then
            gh pr edit "$BRANCH" --title "Add entry: $ENTRY_TITLE" --body-file /tmp/pr-body.md \
              --add-label content:new-entry
            # The pull request was updated, not opened. Both facts are carried
            # out: the issue still needs an answer, and it is a shorter one —
            # the submitter was told to edit the issue and deserves to hear
            # that the edit landed.
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            url="$(gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH" \
              --title "Add entry: $ENTRY_TITLE" \
              --label content:new-entry \
              --body-file /tmp/pr-body.md)"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      # Review-tier labels are a separate, best-effort step: `gh pr create
      # --label` fails outright when a label does not exist, and a fork that has
      # not run bootstrap-labels.yml (or has renamed its tiers) must still get
      # its pull request. `review:intake` marks the first tier on the governance
      # page; `review:data-governance` goes on when an answer matched a field's
      # `escalate_on` list in _data/schema.yml, so the closer-review block in
      # the body is also visible from the pull request list.
      - name: Label the pull request for review
        id: labels
        if: steps.commit.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.draft.outputs.branch }}
          ESCALATE: ${{ steps.scaffold.outputs.escalate }}
        run: |
          set -euo pipefail
          labels="review:intake"
          if [ -n "$ESCALATE" ]; then labels="$labels,review:data-governance"; fi
          if gh pr edit "$BRANCH" --add-label "$labels" 2>/tmp/label-error.txt; then
            echo "Labelled the pull request: $labels" >> "$GITHUB_STEP_SUMMARY"
          else
            # Also reported on the issue (see the linking step below): the run
            # summary is a place maintainers reach only if they already suspect
            # something, and this is the one repair a maintainer has to make.
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Review labels not applied"
              echo
              echo "Could not add \`$labels\` — run **Bootstrap labels** from the Actions tab once, and future pull requests will be labelled. The pull request itself is fine."
              echo
              echo '```'
              cat /tmp/label-error.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A pull request opened with GITHUB_TOKEN does not trigger `pull_request`
      # workflows — GitHub parks them behind "Approve and run" so that a bot
      # cannot start a run by opening a PR. The maintainer then reads "waiting
      # for approval" as "still running" and merges past the only content gate
      # there is. `workflow_dispatch` is the documented exception: a dispatch
      # fired with GITHUB_TOKEN runs immediately, and its check runs bind to the
      # branch head SHA, which is the pull request's head SHA — so they show up
      # in the Checks tab like any other run, just as separate entries.
      #
      # With CONTENT_BOT_TOKEN set the pull request has a real author and the
      # normal triggers fire, so this step stands down rather than duplicating.
      - name: Run the content checks on the new branch
        if: steps.commit.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN }}
          BRANCH: ${{ steps.draft.outputs.branch }}
        run: |
          set -euo pipefail
          if [ -n "$BOT_TOKEN" ]; then
            echo "CONTENT_BOT_TOKEN is set, so the pull request triggers its own checks." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Checks dispatched on \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          for workflow in validate.yml quality.yml lint-workflows.yml; do
            if gh workflow run "$workflow" --ref "$BRANCH"; then
              echo "- \`$workflow\`" >> "$GITHUB_STEP_SUMMARY"
            else
              # Never fail the job over this: the pull request exists either way,
              # and a maintainer can approve the parked runs by hand.
              echo "- \`$workflow\` could not be dispatched; approve the parked run from the Actions tab." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # The acknowledgement: the submission's number, what happens next, how
      # long it takes, where to follow it. Also the one mention of the submitter
      # on the draft, which subscribes them to the review conversation there.
      - name: Link the pull request from the issue
        if: steps.pr.outputs.url != '' && steps.pr.outputs.reused != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          LABELS_FAILED: ${{ steps.labels.outputs.failed }}
        with:
          script: |
            const details = ['To add a screenshot or a PDF, drag it onto this issue while you edit it.'];
            if (process.env.LABELS_FAILED === 'true') {
              details.push(
                'One housekeeping note for the maintainers: the review labels could not be added, which means the repository is missing them. Run **Actions → Bootstrap labels → Run workflow** once and later pull requests will be labelled. This one is fine as it is.'
              );
            }
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.notifyIssue({
              github, context, core,
              kind: 'draft_ready',
              status: notify.STATUS.inReview,
              prUrl: process.env.PR_URL,
              mention: notify.submitter(context),
              vars: { details: details.join('\n\n') }
            });

      # An `issues: edited` re-run updates the pull request that already exists.
      # The comment above tells submitters to edit the issue to correct an
      # answer, so silence here reads as "the edit was ignored". The edit is also
      # the answer to "changes requested", so the status goes back to in-review.
      - name: Say the pull request was updated
        if: steps.pr.outputs.reused == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.notifyIssue({
              github, context, core,
              kind: 'draft_updated',
              status: notify.STATUS.inReview,
              prUrl: process.env.PR_URL,
              mention: notify.submitter(context)
            });

      # Everything above can still leave the issue silent: the push or the
      # pull request itself can be refused — classically because "Allow GitHub
      # Actions to create and approve pull requests" was never ticked — and the
      # failure comment further up only covers the scaffolder.
      - name: Say the pull request could not be opened
        if: failure() && steps.scaffold.outcome != 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.notifyIssue({ github, context, core, kind: 'pr_failed' });

  # With SUBMISSIONS_OPEN set to `false` the job above simply does not run for
  # an outside contributor, and their submission sat there with no reply at all
  # — the one case where the automation is working exactly as configured and
  # still looks broken to the person who used the form.
  say-submissions-are-closed:
    if: >-
      github.event.action == 'opened'
      && contains(github.event.issue.labels.*.name, 'content:new-entry')
      && vars.SUBMISSIONS_OPEN == 'false'
      && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # The default branch, for the message module and the site's wording.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Say a maintainer will handle it by hand
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const notify = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/notify_github.mjs`).href);
            await notify.notifyIssue({ github, context, core, kind: 'paused', status: notify.STATUS.received, once: true });
