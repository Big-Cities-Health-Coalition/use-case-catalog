name: Catalog metrics

# Once a month, count how the catalog is doing — entry-form submissions
# opened, entry pull requests merged, distinct contributing organizations and
# review turnaround, by quarter — write `_data/metrics.json`, and open or update
# a pull request so the governance page's "How the catalog is doing" block can
# be reviewed before it is published.
# The numbers come from this repository's own issues and pull requests through
# two read-only REST calls (scripts/metrics.mjs); nothing is installed on the
# site and no analytics vendor is involved.
#
# The protected default branch is never pushed directly. With GITHUB_TOKEN the
# workflow dispatches the release gates on the generated branch; with
# CONTENT_BOT_TOKEN the pull request triggers them normally. Unchanged figures
# mean no branch or pull request update.
#
# Turn the schedule off by setting the repository variable CATALOG_METRICS to
# `false` (Settings -> Secrets and variables -> Actions -> Variables), or by
# deleting this file; a manual run from the Actions tab always works, and its
# "Preview only" box prints the figures in the run summary without committing
# anything. A changed result opens or updates one `automation/catalog-metrics`
# pull request for a maintainer to review and merge.

on:
  schedule:
    # 07:30 UTC on the 2nd — after the verification sweep on the 1st, off the
    # hour-zero peak where scheduled runs queue for ages.
    - cron: "30 7 2 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — print the figures in the run summary, commit nothing"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: catalog-metrics
  cancel-in-progress: false

jobs:
  # A job whose `if` is false shows up as a bare grey "skipped" with no reason,
  # which reads like a broken workflow rather than a setting somebody chose.
  # This one runs only in that case and says so in the run summary.
  turned-off:
    if: vars.CATALOG_METRICS == 'false' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Say why nothing ran
        run: |
          echo "Catalog metrics are turned off by the repository variable CATALOG_METRICS. Turn them back on in Settings -> Secrets and variables -> Actions -> Variables, or run this workflow by hand from the Actions tab." >> "$GITHUB_STEP_SUMMARY"

  metrics:
    if: vars.CATALOG_METRICS != 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # Reading issues plus reading PR data and opening the maintenance PR.
      issues: read
      pull-requests: write
      # Committing _data/metrics.json on a maintenance branch.
      contents: write
      # Dispatching the gates when the built-in token authors the PR.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Count submissions, publications and turnaround
        id: metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/metrics.mjs --dry-run
          else
            node scripts/metrics.mjs
          fi

      - name: Preview the figures
        if: inputs.dry_run == true
        env:
          SUMMARY: ${{ steps.metrics.outputs.summary }}
        run: |
          {
            echo "### Preview — nothing committed"
            echo
            echo '```json'
            printf '%s\n' "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the refreshed-metrics pull request
        id: cpr
        if: steps.metrics.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/catalog-metrics
          commit-message: "chore(metrics): refresh catalog metrics"
          title: "Refresh catalog metrics"
          body: |
            Automated monthly refresh of `_data/metrics.json` from this
            repository's issues, pull requests, and published entries.

            Review the figures and merge this pull request to publish them.
          add-paths: _data/metrics.json
          delete-branch: true

      - name: Run the required checks on the metrics branch
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN }}
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: |
          set -euo pipefail
          if [ -n "$BOT_TOKEN" ]; then
            echo "CONTENT_BOT_TOKEN is set, so the pull request triggers its own checks." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Checks dispatched on \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          for workflow in validate.yml quality.yml lint-workflows.yml; do
            if gh workflow run "$workflow" --ref "$BRANCH"; then
              echo "- \`$workflow\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$workflow\` could not be dispatched; approve the parked run from the Actions tab." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Report the refreshed figures
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          {
            echo "### Refreshed \`_data/metrics.json\`"
            echo
            echo "Review and merge: $PR_URL"
            echo
            echo '```json'
            cat _data/metrics.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report unchanged figures
        if: steps.metrics.outputs.changed != 'true' && inputs.dry_run != true
        run: echo "The figures have not changed since the last run. Nothing to commit." >> "$GITHUB_STEP_SUMMARY"

      # A red monthly run with nothing but a stack trace in it tells a
      # non-coder maintainer nothing. Whatever failed, this says what it means.
      - name: Explain a failed run
        if: failure()
        run: |
          {
            echo "### Could not update the catalog metrics"
            echo
            echo "This is usually a temporary GitHub API problem. Nothing on the site changed."
            echo
            echo "The next monthly run will try again, or run this workflow now from the Actions tab."
          } >> "$GITHUB_STEP_SUMMARY"
