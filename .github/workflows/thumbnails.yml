name: Generate entry media

# Two steps, one commit, because they feed each other:
#
# 1. Renders the first page of every PDF whose schema field is flagged
#    `thumbnail: true` (shipped: `deck_pdf` -> deck.pdf) to <entry>/<slug>/thumb.jpg,
#    where <entry> is _data/schema.yml's `entry.path` (default catalog/) -- see
#    scripts/thumbnail_sources.mjs, which is the source of truth for that path.
# 2. Writes the AVIF/WebP width variants for every image under that path --
#    including the thumb.jpg step 1 just produced -- and records them in
#    _data/derivatives.json, which _includes/picture.html reads. See
#    scripts/derive_images.mjs and docs/images.md.
#
# The `paths:` trigger below can't read the schema (GitHub evaluates it
# statically before checkout), so it matches any PDF or image anywhere; both
# steps are no-ops when nothing schema-relevant changed. Images are in the list
# so that a maintainer who drags a screenshot into a pull request by hand gets
# the same derivatives the submission bot produces in new-entry.yml.
#
# Uses `pdftoppm` (poppler-utils) rather than ImageMagick: ubuntu-latest ships
# ImageMagick 6, whose `magick` command does not exist, and its PDF delegate is
# disabled by policy on many images. pdftoppm needs neither.

on:
  pull_request:
    paths:
      - "**/*.pdf"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.webp"
  workflow_dispatch:

# One run per PR: a second push while a render/commit is in flight should
# queue behind it, not race it for the same branch push.
concurrency:
  group: thumbnails-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  thumbnail:
    permissions:
      contents: write
      pull-requests: write
      # Re-dispatching validate.yml onto the branch this job just pushed to.
      actions: write
    # Pull requests from forks run with a read-only token and cannot be pushed to.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Manual regeneration always starts from reviewed main, even if the
          # operator selected another ref in the Actions UI.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.event.pull_request.head.ref }}
          # The commit step below pushes, so the credentials have to stay.
          # zizmor: ignore[artipacked]

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Read entry path from schema
        id: entry-path
        run: |
          echo "path=$(node -e "console.log((require('js-yaml').load(require('fs').readFileSync('_data/schema.yml', 'utf8')).entry || {}).path || 'catalog')")" >> "$GITHUB_OUTPUT"

      # `--stale` lists only the decks whose thumb.jpg is missing or older than
      # the PDF by git history -- the last commit to change the PDF is not the
      # thumbnail's last commit or an ancestor of it. Not by mtime: a checkout
      # stamps every file with the time it was written, so a replaced deck kept
      # its old thumbnail. fetch-depth: 0 above gives git that history.
      - name: Generate thumbnails
        run: |
          set -euo pipefail
          node scripts/thumbnail_sources.mjs --stale | while IFS=$'\t' read -r source thumb; do
            [ -n "$source" ] || continue
            if [ ! -s "$source" ]; then
              echo "Skipping empty placeholder at $source"
              continue
            fi
            signature="$(head -c4 "$source" 2>/dev/null || true)"
            if [ "$signature" != "%PDF" ]; then
              echo "Skipping non-PDF file at $source (signature: $signature)"
              continue
            fi
            echo "Generating thumbnail for $source"
            # -singlefile writes "<prefix>.jpg" with no page-number suffix.
            # -scale-to-y -1 keeps the aspect ratio of the 800px-wide render.
            pdftoppm -jpeg -jpegopt quality=85 -scale-to-x 800 -scale-to-y -1 \
              -f 1 -l 1 -singlefile "$source" "${thumb%.jpg}"
          done

      # Idempotent and keyed on the source's bytes and pixel size, not its mtime
      # -- a checkout stamps every file with the checkout time, so an mtime rule
      # would re-encode the whole catalog here on every run and commit
      # byte-identical files back. Never fatal: with no derivatives
      # _includes/picture.html emits the plain <img> it always did.
      - name: Build responsive image derivatives
        id: derivatives
        continue-on-error: true
        run: node scripts/derive_images.mjs

      # Without this line the only trace of a failure here is a red "Validate
      # Content" check on the same pull request, minutes later and somewhere
      # else, with no hint that the two are the same problem.
      - name: Explain a failed derivative build
        if: steps.derivatives.outcome == 'failure'
        run: |
          {
            echo "### The image derivative build failed"
            echo
            echo "The smaller AVIF and WebP versions of these images were not written, so this pull request's **Validate Content** check will fail on the same images at \"Image derivatives are in sync\"."
            echo
            echo "Fix the image (a corrupt or unreadable file is the usual cause — see docs/images.md), push it, and this workflow runs again."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect generated media changes
        id: media
        env:
          ENTRY_PATH: ${{ steps.entry-path.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- "$ENTRY_PATH" _data/derivatives.json)" ]; then
            echo "No thumbnail or derivative changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated media to the pull request branch
        if: steps.media.outputs.changed == 'true' && github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          ENTRY_PATH: ${{ steps.entry-path.outputs.path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$ENTRY_PATH"
          if [ -e _data/derivatives.json ]; then
            git add _data/derivatives.json
          fi
          git commit -m "chore: update entry thumbnails and image derivatives"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Open or update a generated-media pull request
        id: cpr
        if: steps.media.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/entry-media
          commit-message: "chore: update entry thumbnails and image derivatives"
          title: "Update generated entry media"
          body: |
            Regenerated PDF thumbnails and responsive image derivatives.

            Review and merge this pull request to publish the generated media.
          add-paths: |
            ${{ steps.entry-path.outputs.path }}
            _data/derivatives.json
          delete-branch: true

      - name: Run the required checks on the generated-media branch
        if: steps.media.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.event.pull_request.head.ref || steps.cpr.outputs.pull-request-branch }}
        run: |
          set -euo pipefail
          # A manual run may create the PR with CONTENT_BOT_TOKEN, in which case
          # normal pull_request triggers cover the new head. A media commit made
          # during an existing PR always uses GITHUB_TOKEN and must be dispatched.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$BOT_TOKEN" ]; then
            echo "CONTENT_BOT_TOKEN is set, so the pull request triggers its own checks." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for workflow in validate.yml quality.yml lint-workflows.yml; do
            if ! gh workflow run "$workflow" --ref "$BRANCH"; then
              echo "Could not dispatch $workflow; approve the parked run from the Actions tab." >&2
            fi
          done
