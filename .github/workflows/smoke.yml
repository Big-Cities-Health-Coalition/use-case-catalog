name: Weekly Smoke Build

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci

      - name: Regenerate schema-derived files
        run: node scripts/generate.mjs

      - name: Build CSS
        run: npm run build:css

      - name: Validate front matter
        run: ruby scripts/check_front_matter.rb

      - name: Validate file sizes
        run: ruby scripts/check_file_sizes.rb

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo_name" == *.github.io ]]; then
            baseurl=""
          else
            baseurl="/$repo_name"
          fi
          echo "Smoke build with baseurl='${baseurl}'"
          bundle exec jekyll build --destination _site --baseurl "$baseurl"
