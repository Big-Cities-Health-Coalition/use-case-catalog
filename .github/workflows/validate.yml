# The gate every pull request has to clear: generated files in sync, lint,
# formatting, unit tests (Node + Ruby), data/front-matter validation, and a
# production Jekyll build.
#
# `build-matrix` adds the half a single build cannot cover: this repository
# ships four presets and three optional modules, and CI only ever built one
# combination of them. See scripts/build_variants.mjs.
#
# `content` is the content check: entry front matter, data files and image
# derivatives, then the production build and its links. It runs on every pull
# request. A content-only pull request (a submission: only entry files, see
# content-only.yml) runs nothing else here; the code jobs are skipped with
# `if:`, which GitHub reports as passed for their required contexts.
#
# Runs on pull requests and on `workflow_dispatch` for any ref — a dispatch is
# how a fork re-runs the gate on a branch (`gh workflow run validate.yml --ref
# <branch>`). That dispatch also calls the candidate branch's Performance,
# Supply chain, and CodeQL workflows. This lets an older deployment run new
# release gates before those workflow paths exist on its default branch. The
# `status` job posts the aggregate result back onto the dispatched commit.
name: Validate Content

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A dispatch on a branch that already has a pull-request run would otherwise
# double the spend; the newer run wins.
concurrency:
  group: validate-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/content-only.yml

  # The one check a submission's pull request runs. Never gated: it answers "is
  # the entry valid and does the site build with it?" for every change.
  content:
    name: "Content: entries and site build"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci

      - name: Validate data files, front matter and file sizes
        run: npm run validate

      - name: Image derivatives are in sync
        run: node scripts/derive_images.mjs --check

      - name: Build CSS
        run: npm run build:css

      - name: Run Jekyll doctor and build the production site
        run: npm run build:release

      - name: Check built links, assets, anchors, sitemap, feed, and JSON
        run: npm run links:check

  checks:
    name: Lint, test and build
    needs: changes
    # Skipped (reported as passed) on a content-only change. `!cancelled()`
    # keeps a failed classification from skipping it.
    if: ${{ !cancelled() && needs.changes.outputs.content_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; leaving the token in .git/config would let any
          # step (or anything they shell out to) act as the workflow.
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci

      - name: Verify exact toolchain and PHCT ownership contract
        run: |
          git config merge.ours.driver true
          npm run doctor

      - name: Generated files are in sync with _data/schema.yml
        # Fails when .github/ISSUE_TEMPLATE/new-entry.yml, _config.yml or the
        # configurator defaults would change. Fix locally with `npm run generate`.
        run: node scripts/generate.mjs --check

      - name: Lint (ESLint) and formatting (Prettier)
        run: npm run lint && npm run format:check

      - name: Unit tests (Node)
        run: npm test

      - name: Unit tests (Ruby)
        run: npm run test:ruby

      - name: Validate data files, front matter and file sizes
        run: npm run validate

      # Screenshots and their AVIF/WebP siblings travel together (docs/images.md).
      # Fails only when a source image has no up-to-date derivatives: run
      # `npm run images` and commit the result.
      - name: Image derivatives are in sync
        run: node scripts/derive_images.mjs --check

      - name: Build CSS
        run: npm run build:css

      - name: Run Jekyll doctor and build the production site
        run: npm run build:release

      - name: Check built links, assets, anchors, sitemap, feed, and JSON
        run: npm run links:check

  build-matrix:
    name: Build every preset and module combination
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.content_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; leaving the token in .git/config would let any
          # step (or anything they shell out to) act as the workflow.
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci

      # One runner, one bundle install, nine Jekyll builds — the builds
      # themselves are seconds each, so sharding would cost more in setup than
      # it saves. `BUILD_VARIANTS` is read by test/build/variants.test.mjs if
      # this ever does need splitting across runners.
      - name: Build every variant and check the rendered copy
        run: npm run test:build

  coverage:
    name: Coverage evidence
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.content_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci

      - name: Enforce reviewed coverage floors
        run: npm run coverage

      - name: Upload coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

  performance:
    name: Performance and scale
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/performance.yml

  supply-chain:
    name: Supply chain
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/supply-chain.yml

  codeql:
    name: CodeQL
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      security-events: write
      statuses: write
    uses: ./.github/workflows/codeql.yml

  status:
    # `gh workflow run validate.yml --ref <branch>` produces a run with no
    # pull-request payload, so GitHub attaches no check to the branch head and
    # the pull request shows nothing. Post the result as a commit status
    # instead. `statuses: write` is scoped to this job and nothing else.
    name: Report the dispatched run on its commit
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [changes, content, checks, build-matrix, coverage, performance, supply-chain, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Post a commit status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const jobs = ${{ toJSON(needs) }};
            // A content-only change skips the code jobs on purpose; only then
            // does "skipped" count as passed. A skip for any other reason (a
            // cancelled run) still fails.
            const contentOnly = ${{ toJSON(needs.changes.outputs.content_only) }} === 'true';
            const passed = (result) => result === 'success' || (contentOnly && result === 'skipped');
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // workflow_dispatch check runs are not attached to a generated PR.
            // Publish the exact contexts protected-main requires for the jobs
            // owned by this workflow, plus the content check, which is what a
            // reviewer reads on a submission; delegated CodeQL and scale
            // workflows publish their own canonical contexts.
            const requiredContexts = [
              ['content', 'Content: entries and site build'],
              ['checks', 'Lint, test and build'],
              ['build-matrix', 'Build every preset and module combination'],
              ['coverage', 'Coverage evidence'],
            ];
            for (const [jobName, statusContext] of requiredContexts) {
              const result = jobs[jobName].result;
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: passed(result) ? 'success' : 'failure',
                context: statusContext,
                target_url: targetUrl,
                description:
                  result === 'success'
                    ? `${statusContext} passed`
                    : passed(result)
                      ? 'Skipped: content-only change'
                      : `${statusContext}: ${result}`,
              });
            }

            const failed = Object.entries(jobs).filter(([, job]) => !passed(job.result));
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: failed.length === 0 ? 'success' : 'failure',
              context: 'Validate Content (dispatch)',
              target_url: targetUrl,
              description: (failed.length === 0
                ? 'All checks passed'
                : `Failed: ${failed.map(([name]) => name).join(', ')}`
              ).slice(0, 140),
            });
