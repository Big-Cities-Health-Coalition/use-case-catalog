name: Bug report
description: Report something on this site or in its automation that does not work as it should.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal information, PHI, or private security details. Use SECURITY.md for vulnerabilities.
  - type: input
    id: location
    attributes:
      label: Where it happens
      description: The page address, the link to a workflow run, or the repository file.
      placeholder: https://example.org/catalog/ or an Actions run URL
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected path
      options:
        - Visitor site
        - Submission or review workflow
        - Setup or configuration
        - Build or deployment
        - Template update
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Numbered steps using public or fictional data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and any error message
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, or runner
      placeholder: Safari 19 / iPhone; or ubuntu-latest Actions run URL
  - type: input
    id: version
    attributes:
      label: Template release (maintainers)
      description: Optional. The release and commit recorded in .phct-version.json, if you know them.
      placeholder: v1.9.0 / 40-character SHA
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal information, PHI, and non-public data.
          required: true
