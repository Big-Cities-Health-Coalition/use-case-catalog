name: Documentation correction
description: Report unclear, incomplete, inaccurate, or outdated guidance on this site or in its repository.
title: "[Docs] "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal information, PHI, private URLs, or vulnerability details. Use the private security route for security-sensitive reports.
  - type: input
    id: location
    attributes:
      label: Page, file, or section
      description: Link to the public page or name the repository path and heading.
      placeholder: docs/launch.md — Configure repository settings
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Who is affected
      options:
        - First-time site owner
        - Content maintainer
        - Technical maintainer
        - Contributor or submitter
        - Site visitor
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear
      description: Explain what you tried, what the guidance led you to expect, and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Optional wording, example, screenshot, or link to an authoritative public source.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report and every linked resource are public and contain no credentials, personal information, PHI, or private security details.
          required: true
