name: Feature proposal
description: Suggest a new feature or an improvement to how this site works.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: The task that is hard today and who runs into it — not only the change you would make.
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Who needs this and how often
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Accessibility, privacy, security, or anything that must keep working for maintainers who do not write code.
  - type: checkboxes
    id: routing
    attributes:
      label: Scope check
      options:
        - label: This is about how the site works, not a change to one entry (use "Suggest an edit" on the entry's page for that).
          required: true
